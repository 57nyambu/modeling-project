# supermarket.virontech.me: Supermarket Checkout Simulation
#
# Django + gunicorn (PM2 process "supermarket-api") listens on 127.0.0.1:4970.
# nginx serves the built React app from web/dist and passes /api/ to Django.
#
# Install (details in deploy/README.md):
#   sudo cp deploy/nginx/supermarket.virontech.me.conf /etc/nginx/sites-available/
#   sudo ln -s /etc/nginx/sites-available/supermarket.virontech.me.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d supermarket.virontech.me
#
# The API has no login and no CSRF (by design, see api/simulator/views.py), and
# some requests run CPU-heavy simulations, so those are rate-limited per IP.

# Requests that run a simulation: every POST, and the validation (a GET that
# simulates 200,000 minutes).
map "$request_method:$uri" $supermarket_sim_key {
    "~^POST:"                  $binary_remote_addr;
    "~^GET:/api/validation"    $binary_remote_addr;
    default                    "";                  # empty key = not counted
}

# Report downloads: each CSV re-runs a simulation, each PNG runs Matplotlib.
map $uri $supermarket_export_key {
    "~^/api/.+\.(csv|png)$"    $binary_remote_addr;
    default                    "";
}

limit_req_zone $supermarket_sim_key    zone=supermarket_sim:10m    rate=12r/m;
limit_req_zone $supermarket_export_key zone=supermarket_export:10m rate=30r/m;
limit_req_zone $binary_remote_addr     zone=supermarket_api:10m    rate=120r/m;

server {
    listen 80;
    listen [::]:80;
    server_name supermarket.virontech.me;

    root /home/modeling-project/web/dist;
    index index.html;

    client_max_body_size 1M;        # JSON parameter bodies only
    server_tokens off;

    # If the DNS record is proxied through Cloudflare (orange cloud), every request
    # arrives from a Cloudflare address and all visitors would share one rate limit.
    # Then restore the visitor's address, one set_real_ip_from line per range at
    # https://www.cloudflare.com/ips/ :
    #   set_real_ip_from 173.245.48.0/20;
    #   real_ip_header CF-Connecting-IP;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/csv application/json application/javascript image/svg+xml;

    location /api/ {
        limit_req zone=supermarket_sim burst=10 nodelay;
        limit_req zone=supermarket_export burst=20 nodelay;
        limit_req zone=supermarket_api burst=60 nodelay;
        limit_req_status 429;
        limit_req_log_level warn;

        proxy_pass http://127.0.0.1:4970;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Large comparisons and the validation run inside the request;
        # gunicorn allows the same 180 s (api/gunicorn.conf.py).
        proxy_read_timeout 180s;

        # Django sends these headers too: keep one copy, from the server block.
        proxy_hide_header X-Frame-Options;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header Referrer-Policy;

        # Errors raised by nginx itself are returned as JSON, which the app
        # shows to the user like any other API error.
        error_page 429 = @too_many_requests;
        error_page 502 503 = @api_unavailable;
        error_page 504 = @api_timeout;

        # Optional: require a password to DELETE saved runs and comparisons.
        #   sudo apt install -y apache2-utils
        #   sudo htpasswd -c /etc/nginx/.htpasswd-supermarket <user>
        # limit_except GET POST {
        #     auth_basic "Supermarket admin";
        #     auth_basic_user_file /etc/nginx/.htpasswd-supermarket;
        # }
    }

    location @too_many_requests {
        default_type application/json;
        return 429 '{"error": "too many requests from your network: wait a minute and try again"}';
    }

    location @api_unavailable {
        default_type application/json;
        return 503 '{"error": "the simulation server is not running: try again in a minute"}';
    }

    location @api_timeout {
        default_type application/json;
        return 504 '{"error": "the simulation took longer than 3 minutes: use fewer replications or a shorter run"}';
    }

    # Built files have content hashes in their names: cache them for a year.
    location /assets/ {
        expires 1y;
        access_log off;
        try_files $uri =404;
    }

    # index.html is revalidated on every visit, so a new deploy shows at once.
    location = /index.html {
        expires -1;
    }

    # SPA fallback (also covers /admin: the Django admin is not exposed).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
