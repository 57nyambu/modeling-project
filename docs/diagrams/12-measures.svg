<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 480" width="1100" height="480" role="img" aria-labelledby="measuring-performance-t measuring-performance-d" font-family="&quot;IBM Plex Sans&quot;, &quot;Segoe UI&quot;, system-ui, -apple-system, sans-serif"><title id="measuring-performance-t">Measuring performance</title><desc id="measuring-performance-d">How time-weighted queue length, waiting time, utilisation, time in store and Little's law are calculated, illustrated with the three-customer example.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#5d6b7a"/></marker><marker id="arrow-strong" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#172331"/></marker><marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#257de0"/></marker></defs><rect x="0" y="0" width="1100" height="480" fill="#ffffff"/><text x="30" y="34" font-size="13.5" font-weight="600" fill="#172331" text-anchor="start">Queue length is a step function</text><text x="30" y="54" font-size="11.5" fill="#556270" font-weight="400" text-anchor="start"><tspan x="30" dy="0">Q(t) only changes at events, so its area is an exact sum of rectangles: value x how long it</tspan><tspan x="30" dy="15">lasted. Dividing by T gives the time-weighted average.</tspan></text><g><line x1="70" x2="590" y1="250" y2="250" stroke="#c2c8cf"/><text x="62" y="254" font-size="10.5" font-weight="400" fill="#556270" text-anchor="end">0</text></g><g><line x1="70" x2="590" y1="198" y2="198" stroke="#eef1f4"/><text x="62" y="202" font-size="10.5" font-weight="400" fill="#556270" text-anchor="end">1</text></g><g><line x1="70" x2="590" y1="146" y2="146" stroke="#eef1f4"/><text x="62" y="150" font-size="10.5" font-weight="400" fill="#556270" text-anchor="end">2</text></g><rect x="200" y="198" width="32.5" height="52" fill="#257de0" fill-opacity="0.12"/><rect x="232.5" y="146" width="97.5" height="104" fill="#257de0" fill-opacity="0.2"/><rect x="330" y="198" width="130" height="52" fill="#257de0" fill-opacity="0.12"/><path d="M70,250H200V198H232.5V146H330V198H460V250H590V250" fill="none" stroke="#257de0" stroke-width="2.2"/><g><rect x="203.67" y="178" width="25.16" height="16" rx="3" fill="#ffffff"/><text x="216.25" y="189" font-size="11" fill="#172331" text-anchor="middle" font-weight="400">0.5</text></g><g><rect x="240.07" y="126" width="82.36" height="16" rx="3" fill="#ffffff"/><text x="281.25" y="137" font-size="11" fill="#172331" text-anchor="middle" font-weight="400">1.5 x 2 = 3.0</text></g><g><rect x="359.54" y="178" width="70.92" height="16" rx="3" fill="#ffffff"/><text x="395" y="189" font-size="11" fill="#172331" text-anchor="middle" font-weight="400">2 x 1 = 2.0</text></g><text x="70" y="268" font-size="10.5" font-weight="400" fill="#556270" text-anchor="middle">0</text><text x="200" y="268" font-size="10.5" font-weight="400" fill="#556270" text-anchor="middle">2</text><text x="330" y="268" font-size="10.5" font-weight="400" fill="#556270" text-anchor="middle">4</text><text x="460" y="268" font-size="10.5" font-weight="400" fill="#556270" text-anchor="middle">6</text><text x="590" y="268" font-size="10.5" font-weight="400" fill="#556270" text-anchor="middle">8</text><text x="590" y="284" font-size="10.5" font-weight="400" fill="#8793a0" text-anchor="end">minutes</text><text x="70" y="320" font-size="12.5" font-weight="600" fill="#172331" text-anchor="start">Area = 0.5 + 3.0 + 2.0 = 5.5 customer-minutes</text><text x="70" y="342" font-size="12.5" font-weight="400" fill="#172331" text-anchor="start">Over T = 20 minutes: Lq = 5.5 / 20 = 0.275 customers waiting on average</text><rect x="135" y="362" width="390" height="18" rx="3" fill="#172331"/><text x="330" y="375" font-size="11" font-weight="400" fill="#ffffff" text-anchor="middle">cashier busy 6 of 20 minutes: utilisation 30%</text><g><rect x="650" y="30" width="420" height="80" rx="8" fill="#eef4fd" stroke="#9dbbe8"/><text x="666" y="54" font-size="13" font-weight="600" fill="#172331" text-anchor="start">Average queue length</text><text x="666" y="74" font-size="12" font-weight="400" fill="#172331" text-anchor="start" font-family="&quot;IBM Plex Mono&quot;, Consolas, ui-monospace, monospace">Lq = (1/T) x area under Q(t)</text><text x="666" y="94" font-size="11" font-weight="400" fill="#556270" text-anchor="start">time-weighted: a long queue counts for as long as it lasts</text></g><g><rect x="650" y="122" width="420" height="80" rx="8" fill="#ffffff" stroke="#d5dbe2"/><text x="666" y="146" font-size="13" font-weight="600" fill="#172331" text-anchor="start">Average waiting time</text><text x="666" y="166" font-size="12" font-weight="400" fill="#172331" text-anchor="start" font-family="&quot;IBM Plex Mono&quot;, Consolas, ui-monospace, monospace">Wq = (1/N) x sum of (service start - queue join)</text><text x="666" y="186" font-size="11" font-weight="400" fill="#556270" text-anchor="start">over customers whose service started</text></g><g><rect x="650" y="214" width="420" height="80" rx="8" fill="#ffffff" stroke="#d5dbe2"/><text x="666" y="238" font-size="13" font-weight="600" fill="#172331" text-anchor="start">Cashier utilisation</text><text x="666" y="258" font-size="12" font-weight="400" fill="#172331" text-anchor="start" font-family="&quot;IBM Plex Mono&quot;, Consolas, ui-monospace, monospace">rho_c = busy time of counter c / T</text><text x="666" y="278" font-size="11" font-weight="400" fill="#556270" text-anchor="start">busy time is clipped at closing time</text></g><g><rect x="650" y="306" width="420" height="80" rx="8" fill="#ffffff" stroke="#d5dbe2"/><text x="666" y="330" font-size="13" font-weight="600" fill="#172331" text-anchor="start">Average time in store</text><text x="666" y="350" font-size="12" font-weight="400" fill="#172331" text-anchor="start" font-family="&quot;IBM Plex Mono&quot;, Consolas, ui-monospace, monospace">W = (1/N) x sum of (departure - arrival)</text><text x="666" y="370" font-size="11" font-weight="400" fill="#556270" text-anchor="start">over customers who were served</text></g><g><rect x="650" y="398" width="420" height="80" rx="8" fill="#ffffff" stroke="#d5dbe2"/><text x="666" y="422" font-size="13" font-weight="600" fill="#172331" text-anchor="start">Little's law</text><text x="666" y="442" font-size="12" font-weight="400" fill="#172331" text-anchor="start" font-family="&quot;IBM Plex Mono&quot;, Consolas, ui-monospace, monospace">Lq = arrival rate x Wq</text><text x="666" y="462" font-size="11" font-weight="400" fill="#556270" text-anchor="start">a built-in consistency check on every run</text></g></svg>