<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 640" width="1100" height="640" role="img" aria-labelledby="entities-attributes-and-resources-t entities-attributes-and-resources-d" font-family="&quot;IBM Plex Sans&quot;, &quot;Segoe UI&quot;, system-ui, -apple-system, sans-serif"><title id="entities-attributes-and-resources-t">Entities, attributes and resources</title><desc id="entities-attributes-and-resources-d">The conceptual model: the customer entity and its attributes, checkout counters and sections as resources, the strategy as a decision rule, and the global simulation state.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#5d6b7a"/></marker><marker id="arrow-strong" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#172331"/></marker><marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#257de0"/></marker></defs><rect x="0" y="0" width="1100" height="640" fill="#ffffff"/><g><rect x="30" y="30" width="318" height="227" rx="8" fill="#ffffff" stroke="#aa9cf0" stroke-width="1.3"/><path d="M30,76V38Q30,30 38,30H340Q348,30 348,38V76Z" fill="#f2effd"/><line x1="30" x2="348" y1="76" y2="76" stroke="#aa9cf0"/><text x="42" y="51" font-size="13.5" font-weight="600" fill="#172331" text-anchor="start">Customer</text><text x="42" y="68" font-size="11" font-weight="400" fill="#556270" text-anchor="start">Entity: moves through the store</text><text x="42" y="94" font-size="11.5" font-weight="400" fill="#556270" text-anchor="start">id and arrival time</text><text x="42" y="113" font-size="11.5" font-weight="400" fill="#556270" text-anchor="start">basket category: small, medium or large</text><text x="42" y="132" font-size="11.5" font-weight="400" fill="#556270" text-anchor="start">number of items n</text><text x="42" y="151" font-size="11.5" font-weight="400" fill="#556270" text-anchor="start">items per section and route</text><text x="42" y="170" font-size="11.5" font-weight="400" fill="#556270" text-anchor="start">walking speed v</text><text x="42" y="189" font-size="11.5" font-weight="400" fill="#556270" text-anchor="start">pick time in each section</text><text x="42" y="208" font-size="11.5" font-weight="400" fill="#556270" text-anchor="start">service time S (hidden from other customers)</text><text x="42" y="227" font-size="11.5" font-weight="400" fill="#556270" text-anchor="start">expected service E[S | n] (visible)</text><text x="42" y="246" font-size="11.5" font-weight="400" fill="#556270" text-anchor="start">recorded: queue join, service start, departure</text></g><g><rect x="752" y="30" width="318" height="170" rx="8" fill="#ffffff" stroke="#74c7a5" stroke-width="1.3"/><path d="M752,76V38Q752,30 760,30H1062Q1070,30 1070,38V76Z" fill="#e9f7f1"/><line x1="752" x2="1070" y1="76" y2="76" stroke="#74c7a5"/><text x="764" y="51" font-size="13.5" font-weight="600" fill="#172331" text-anchor="start">Checkout counter</text><text x="764" y="68" font-size="11" font-weight="400" fill="#556270" text-anchor="start">Resource: one cashier, capacity 1</text><text x="764" y="94" font-size="11.5" font-weight="400" fill="#556270" text-anchor="start">number and type (normal or express)</text><text x="764" y="113" font-size="11.5" font-weight="400" fill="#556270" text-anchor="start">first-in, first-out queue</text><text x="764" y="132" font-size="11.5" font-weight="400" fill="#556270" text-anchor="start">customer being served</text><text x="764" y="151" font-size="11.5" font-weight="400" fill="#556270" text-anchor="start">busy time, for utilisation</text><text x="764" y="170" font-size="11.5" font-weight="400" fill="#556270" text-anchor="start">area under the queue length, for averages</text><text x="764" y="189" font-size="11.5" font-weight="400" fill="#556270" text-anchor="start">customers served</text></g><g><rect x="392" y="176" width="316" height="170" rx="8" fill="#ffffff" stroke="#b5bec8" stroke-width="1.3"/><path d="M392,222V184Q392,176 400,176H700Q708,176 708,184V222Z" fill="#f5f7f9"/><line x1="392" x2="708" y1="222" y2="222" stroke="#b5bec8"/><text x="404" y="197" font-size="13.5" font-weight="600" fill="#172331" text-anchor="start">Simulation state</text><text x="404" y="214" font-size="11" font-weight="400" fill="#556270" text-anchor="start">Global variables, changed only at events</text><text x="404" y="240" font-size="11.5" font-weight="400" fill="#556270" text-anchor="start">clock t</text><text x="404" y="259" font-size="11.5" font-weight="400" fill="#556270" text-anchor="start">event list, ordered by time</text><text x="404" y="278" font-size="11.5" font-weight="400" fill="#556270" text-anchor="start">Q_c(t): customers waiting at counter c</text><text x="404" y="297" font-size="11.5" font-weight="400" fill="#556270" text-anchor="start">B_c(t): 1 if counter c is busy, else 0</text><text x="404" y="316" font-size="11.5" font-weight="400" fill="#556270" text-anchor="start">customers in the store</text><text x="404" y="335" font-size="11.5" font-weight="400" fill="#556270" text-anchor="start">customers generated and served</text></g><g><rect x="30" y="340" width="318" height="113" rx="8" fill="#ffffff" stroke="#74c7a5" stroke-width="1.3"/><path d="M30,386V348Q30,340 38,340H340Q348,340 348,348V386Z" fill="#e9f7f1"/><line x1="30" x2="348" y1="386" y2="386" stroke="#74c7a5"/><text x="42" y="361" font-size="13.5" font-weight="600" fill="#172331" text-anchor="start">Shopping section</text><text x="42" y="378" font-size="11" font-weight="400" fill="#556270" text-anchor="start">Unlimited capacity: nobody queues to shop</text><text x="42" y="404" font-size="11.5" font-weight="400" fill="#556270" text-anchor="start">Grocery, Beverages, Household, Personal Care</text><text x="42" y="423" font-size="11.5" font-weight="400" fill="#556270" text-anchor="start">share of basket items</text><text x="42" y="442" font-size="11.5" font-weight="400" fill="#556270" text-anchor="start">position on the floor plan</text></g><g><rect x="752" y="340" width="318" height="113" rx="8" fill="#ffffff" stroke="#e0b43c" stroke-width="1.3"/><path d="M752,386V348Q752,340 760,340H1062Q1070,340 1070,348V386Z" fill="#fff7e0"/><line x1="752" x2="1070" y1="386" y2="386" stroke="#e0b43c"/><text x="764" y="361" font-size="13.5" font-weight="600" fill="#172331" text-anchor="start">Checkout strategy</text><text x="764" y="378" font-size="11" font-weight="400" fill="#556270" text-anchor="start">Decision rule applied at the checkout area</text><text x="764" y="404" font-size="11.5" font-weight="400" fill="#556270" text-anchor="start">Shortest Queue</text><text x="764" y="423" font-size="11.5" font-weight="400" fill="#556270" text-anchor="start">Shortest Estimated Waiting Time</text><text x="764" y="442" font-size="11.5" font-weight="400" fill="#556270" text-anchor="start">Express and Normal (5 items or fewer)</text></g><g><path d="M189,254 L189,340" fill="none" stroke="#5d6b7a" stroke-width="1.4" marker-end="url(#arrow)" stroke-linejoin="round"/><g><rect x="102.06" y="294" width="173.88" height="16" rx="3" fill="#ffffff"/><text x="189" y="305" font-size="11" fill="#556270" text-anchor="middle" font-weight="400">visits 1 to 4, in store order</text></g></g><g><path d="M348,110 L752,110" fill="none" stroke="#5d6b7a" stroke-width="1.4" marker-end="url(#arrow)" stroke-linejoin="round"/><g><rect x="428.74" y="104" width="242.52" height="16" rx="3" fill="#ffffff"/><text x="550" y="115" font-size="11" fill="#556270" text-anchor="middle" font-weight="400">queues at, then is served by, exactly one</text></g></g><g><path d="M911,340 L911,210" fill="none" stroke="#5d6b7a" stroke-width="1.4" marker-end="url(#arrow)" stroke-linejoin="round"/><g><rect x="826.92" y="272" width="168.16" height="16" rx="3" fill="#ffffff"/><text x="911" y="283" font-size="11" fill="#556270" text-anchor="middle" font-weight="400">assigns each customer to one</text></g></g><g><path d="M392,250 L348,250" fill="none" stroke="#5d6b7a" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#arrow)" stroke-linejoin="round"/></g><g><path d="M708,250 L752,250" fill="none" stroke="#5d6b7a" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#arrow)" stroke-linejoin="round"/></g><g><rect x="412.23" y="356.5" width="275.54" height="15.5" rx="3" fill="#ffffff"/><text x="550" y="367" font-size="10.5" fill="#556270" text-anchor="middle" font-weight="400">events change the state of customers and counters</text></g><g><rect x="30" y="480" width="520" height="120" rx="8" fill="#eef4fd" stroke="#9dbbe8" stroke-width="1.3"/><text x="42" y="510.5" font-size="13" font-weight="600" fill="#172331" text-anchor="start">Activities: things that take time</text><text x="42" y="527.5" font-size="11.5" fill="#556270" text-anchor="start">walking along the walkways (route length / speed)</text><text x="42" y="544.5" font-size="11.5" fill="#556270" text-anchor="start">picking items in a section</text><text x="42" y="561.5" font-size="11.5" fill="#556270" text-anchor="start">waiting in a queue (an output of the model)</text><text x="42" y="578.5" font-size="11.5" fill="#556270" text-anchor="start">scanning the items and paying</text></g><g><rect x="570" y="480" width="500" height="120" rx="8" fill="#ffffff" stroke="#d5dbe2" stroke-width="1.3"/><text x="582" y="510.5" font-size="13" font-weight="600" fill="#172331" text-anchor="start">Events: instants where the state changes</text><text x="582" y="527.5" font-size="11.5" fill="#556270" text-anchor="start">ARRIVAL and SECTION_ARRIVE</text><text x="582" y="544.5" font-size="11.5" fill="#556270" text-anchor="start">SECTION_DEPART</text><text x="582" y="561.5" font-size="11.5" fill="#556270" text-anchor="start">CHECKOUT_ARRIVE: the strategy chooses a counter</text><text x="582" y="578.5" font-size="11.5" fill="#556270" text-anchor="start">SERVICE_END: pay, leave, next customer starts</text></g><g><g><rect x="30" y="615" width="16" height="14" rx="3" fill="#f2effd" stroke="#aa9cf0" stroke-width="1.2"/><text x="52" y="626" font-size="11" font-weight="400" fill="#556270" text-anchor="start">Entity</text></g><g><rect x="106.32" y="615" width="16" height="14" rx="3" fill="#e9f7f1" stroke="#74c7a5" stroke-width="1.2"/><text x="128.32" y="626" font-size="11" font-weight="400" fill="#556270" text-anchor="start">Resource</text></g><g><path d="M202.07999999999998,614L210.07999999999998,622L202.07999999999998,630L194.07999999999998,622Z" fill="#fff7e0" stroke="#e0b43c"/><text x="216.07999999999998" y="626" font-size="11" font-weight="400" fill="#556270" text-anchor="start">Decision</text></g><g><rect x="281.84" y="615" width="16" height="14" rx="3" fill="#f5f7f9" stroke="#b5bec8" stroke-width="1.2"/><text x="303.84" y="626" font-size="11" font-weight="400" fill="#556270" text-anchor="start">Data or input</text></g><g><rect x="398.2" y="615" width="16" height="14" rx="3" fill="#eef4fd" stroke="#9dbbe8" stroke-width="1.2"/><text x="420.2" y="626" font-size="11" font-weight="400" fill="#556270" text-anchor="start">Activity or step</text></g></g></svg>