<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 470" width="1100" height="470" role="img" aria-labelledby="validation-against-queueing-theory-t validation-against-queueing-theory-d" font-family="&quot;IBM Plex Sans&quot;, &quot;Segoe UI&quot;, system-ui, -apple-system, sans-serif"><title id="validation-against-queueing-theory-t">Validation against queueing theory</title><desc id="validation-against-queueing-theory-d">Why the full model reduces to an M/M/1 queue when it has one counter and exponential service, and the validation results for lambda 0.7 and mu 1.0.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#5d6b7a"/></marker><marker id="arrow-strong" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#172331"/></marker><marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#257de0"/></marker></defs><rect x="0" y="0" width="1100" height="470" fill="#ffffff"/><g><g><rect x="30" y="40" width="180" height="86" rx="8" fill="#f5f7f9" stroke="#b5bec8" stroke-width="1.3"/><text x="120" y="79" font-size="13" font-weight="600" fill="#172331" text-anchor="middle">Poisson arrivals</text><text x="120" y="96" font-size="11.5" fill="#556270" text-anchor="middle">rate lambda</text></g><g><path d="M210,83 L244,83" fill="none" stroke="#172331" stroke-width="1.8" marker-end="url(#arrow-strong)" stroke-linejoin="round"/></g></g><g><g><rect x="244" y="40" width="180" height="86" rx="8" fill="#eef4fd" stroke="#9dbbe8" stroke-width="1.3"/><text x="334" y="70.5" font-size="13" font-weight="600" fill="#172331" text-anchor="middle">Shopping</text><text x="334" y="87.5" font-size="11.5" fill="#556270" text-anchor="middle">unlimited room:</text><text x="334" y="104.5" font-size="11.5" fill="#556270" text-anchor="middle">an M/G/infinity stage</text></g><g><path d="M424,83 L458,83" fill="none" stroke="#172331" stroke-width="1.8" marker-end="url(#arrow-strong)" stroke-linejoin="round"/></g></g><g><g><rect x="458" y="40" width="180" height="86" rx="8" fill="#f5f7f9" stroke="#b5bec8" stroke-width="1.3"/><text x="548" y="70.5" font-size="13" font-weight="600" fill="#172331" text-anchor="middle">Still Poisson</text><text x="548" y="87.5" font-size="11.5" fill="#556270" text-anchor="middle">customers reach the</text><text x="548" y="104.5" font-size="11.5" fill="#556270" text-anchor="middle">checkout at rate lambda</text></g><g><path d="M638,83 L672,83" fill="none" stroke="#172331" stroke-width="1.8" marker-end="url(#arrow-strong)" stroke-linejoin="round"/></g></g><g><g><rect x="672" y="40" width="180" height="86" rx="8" fill="#e9f7f1" stroke="#74c7a5" stroke-width="1.3"/><text x="762" y="70.5" font-size="13" font-weight="600" fill="#172331" text-anchor="middle">One counter</text><text x="762" y="87.5" font-size="11.5" fill="#556270" text-anchor="middle">exponential service,</text><text x="762" y="104.5" font-size="11.5" fill="#556270" text-anchor="middle">rate mu: M/M/1</text></g><g><path d="M852,83 L886,83" fill="none" stroke="#172331" stroke-width="1.8" marker-end="url(#arrow-strong)" stroke-linejoin="round"/></g></g><g><g><rect x="886" y="40" width="180" height="86" rx="8" fill="#fff7e0" stroke="#e0b43c" stroke-width="1.3"/><text x="976" y="70.5" font-size="13" font-weight="600" fill="#172331" text-anchor="middle">Compare</text><text x="976" y="87.5" font-size="11.5" fill="#556270" text-anchor="middle">simulation against</text><text x="976" y="104.5" font-size="11.5" fill="#556270" text-anchor="middle">exact formulas</text></g></g><text x="30" y="160" font-size="12" fill="#556270" font-weight="400" text-anchor="start"><tspan x="30" dy="0">A Poisson stream that passes through a stage with unlimited capacity leaves it as a Poisson stream with the same rate, whatever the shopping times are. So with one</tspan><tspan x="30" dy="15">counter and exponential service times, the checkout is exactly an M/M/1 queue and the engine can be checked against known formulas.</tspan></text><text x="30" y="228" font-size="13" font-weight="600" fill="#172331" text-anchor="start">Results: lambda = 0.7, mu = 1.0, 10 replications of 20,000 minutes</text><text x="30" y="260" font-size="11.5" font-weight="600" fill="#556270" text-anchor="start">Measure</text><text x="210" y="260" font-size="11.5" font-weight="600" fill="#556270" text-anchor="start">Formula</text><text x="450" y="260" font-size="11.5" font-weight="600" fill="#556270" text-anchor="start">Theory</text><text x="560" y="260" font-size="11.5" font-weight="600" fill="#556270" text-anchor="start">Simulated mean</text><text x="700" y="260" font-size="11.5" font-weight="600" fill="#556270" text-anchor="start">95% confidence interval</text><text x="900" y="260" font-size="11.5" font-weight="600" fill="#556270" text-anchor="start">Result</text><g><line x1="30" x2="1070" y1="270" y2="270" stroke="#eef1f4"/><text x="30" y="292" font-size="12.5" font-weight="400" fill="#172331" text-anchor="start">Utilisation</text><text x="210" y="292" font-size="12" font-weight="400" fill="#172331" text-anchor="start" font-family="&quot;IBM Plex Mono&quot;, Consolas, ui-monospace, monospace">rho = lambda / mu</text><text x="450" y="292" font-size="12.5" font-weight="600" fill="#172331" text-anchor="start">0.7000</text><text x="560" y="292" font-size="12.5" font-weight="400" fill="#172331" text-anchor="start">0.6986</text><text x="700" y="292" font-size="12.5" font-weight="400" fill="#172331" text-anchor="start">0.6954 to 0.7017</text><text x="900" y="292" font-size="12.5" font-weight="600" fill="#006c10" text-anchor="start">Theory inside the CI</text></g><g><line x1="30" x2="1070" y1="304" y2="304" stroke="#eef1f4"/><text x="30" y="326" font-size="12.5" font-weight="400" fill="#172331" text-anchor="start">Average wait (min)</text><text x="210" y="326" font-size="12" font-weight="400" fill="#172331" text-anchor="start" font-family="&quot;IBM Plex Mono&quot;, Consolas, ui-monospace, monospace">Wq = rho / (mu - lambda)</text><text x="450" y="326" font-size="12.5" font-weight="600" fill="#172331" text-anchor="start">2.3333</text><text x="560" y="326" font-size="12.5" font-weight="400" fill="#172331" text-anchor="start">2.2760</text><text x="700" y="326" font-size="12.5" font-weight="400" fill="#172331" text-anchor="start">2.1863 to 2.3657</text><text x="900" y="326" font-size="12.5" font-weight="600" fill="#006c10" text-anchor="start">Theory inside the CI</text></g><g><line x1="30" x2="1070" y1="338" y2="338" stroke="#eef1f4"/><text x="30" y="360" font-size="12.5" font-weight="400" fill="#172331" text-anchor="start">Average queue</text><text x="210" y="360" font-size="12" font-weight="400" fill="#172331" text-anchor="start" font-family="&quot;IBM Plex Mono&quot;, Consolas, ui-monospace, monospace">Lq = rho^2 / (1 - rho)</text><text x="450" y="360" font-size="12.5" font-weight="600" fill="#172331" text-anchor="start">1.6333</text><text x="560" y="360" font-size="12.5" font-weight="400" fill="#172331" text-anchor="start">1.5942</text><text x="700" y="360" font-size="12.5" font-weight="400" fill="#172331" text-anchor="start">1.5292 to 1.6592</text><text x="900" y="360" font-size="12.5" font-weight="600" fill="#006c10" text-anchor="start">Theory inside the CI</text></g><rect x="30" y="390" width="1040" height="56" rx="8" fill="#f6f8fa" stroke="#e2e6eb"/><text x="48" y="414" font-size="12" fill="#556270" font-weight="400" text-anchor="start"><tspan x="48" dy="0">The simulated values sit slightly below theory because every replication starts with an empty store. Run the check yourself on the Validation page, or with</tspan><tspan x="48" dy="15">python -m simulation.cli --validate.</tspan></text></svg>