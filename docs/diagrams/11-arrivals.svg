78.0,140.2L282.5,136.8L287.0,133.5L291.5,130.5L296.0,127.6L300.5,124.9L305.0,122.5L309.5,120.2L314.0,118.2L318.5,116.4L323.0,114.8L327.5,113.5L332.0,112.4L336.5,111.5L341.0,110.9L345.5,110.6L350.0,110.4L354.5,110.6L359.0,110.9L363.5,111.5L368.0,112.4L372.5,113.5L377.0,114.8L381.5,116.4L386.0,118.2L390.5,120.2L395.0,122.5L399.5,124.9L404.0,127.6L408.5,130.5L413.0,133.5L417.5,136.8L422.0,140.2L426.5,143.7L431.0,147.5L435.5,151.4L440.0,155.4L444.5,159.5L449.0,163.7L453.5,168.1L458.0,172.5L462.5,177.0L467.0,181.6L471.5,186.2L476.0,190.9L480.5,195.6L485.0,200.3L489.5,205.0L494.0,209.7L498.5,214.3L503.0,219.0L507.5,223.5L512.0,228.1L516.5,232.5L521.0,236.8L525.5,241.1L530.0,245.2L534.5,249.2L539.0,253.1L543.5,256.8L548.0,260.4L552.5,263.8L557.0,267.1L561.5,270.1L566.0,273.0L570.5,275.6L575.0,278.1L579.5,280.4L584.0,282.4L588.5,284.2L593.0,285.7L597.5,287.1L602.0,288.2L606.5,289.0L611.0,289.7L615.5,290.0L620.0,290.1" fill="none" stroke="#257de0" stroke-width="2.2"/><line x1="80" x2="620" y1="200.28985507246375" y2="200.28985507246375" stroke="#172331" stroke-width="1.6"/><g><text x="96.2" y="193.28985507246375" font-size="11" fill="#172331" text-anchor="start" font-weight="400">Constant profile: 1.4 per min all day</text></g><g><text x="350" y="101.43478260869568" font-size="11" fill="#172331" text-anchor="middle" font-weight="400">Midday peak: 2.10 per min</text></g><g><text x="96.2" y="311.1449275362319" font-size="11" fill="#556270" text-anchor="start" font-weight="400">0.70 at opening and closing</text></g><line x1="80" x2="620" y1="380" y2="380" stroke="#c2c8cf"/><text x="80" y="398" font-size="10.5" font-weight="400" fill="#556270" text-anchor="middle">0</text><text x="305" y="398" font-size="10.5" font-weight="400" fill="#556270" text-anchor="middle">100</text><text x="530" y="398" font-size="10.5" font-weight="400" fill="#556270" text-anchor="middle">200</text><text x="620" y="414" font-size="10.5" font-weight="400" fill="#8793a0" text-anchor="end">minutes after opening</text><g transform="translate(36,225) rotate(-90)"><text x="0" y="0" font-size="10.5" font-weight="400" fill="#8793a0" text-anchor="middle">customers per minute</text></g><text x="80" y="438" font-size="11.5" fill="#556270" font-weight="400" text-anchor="start"><tspan x="80" dy="0">Both profiles bring the same number of customers on average: the area under each line is</tspan><tspan x="80" dy="15">the same.</tspan></text><text x="680" y="34" font-size="13.5" font-weight="600" fill="#172331" text-anchor="start">Thinning: arrivals for a changing rate</text><g><circle cx="690" cy="84" r="10" fill="#172331" stroke="#172331" stroke-width="1.2"/><text x="690" y="88" font-size="11" font-weight="600" fill="#ffffff" text-anchor="middle">1</text></g><g><rect x="710" y="62" width="360" height="62" rx="8" fill="#eef4fd" stroke="#9dbbe8" stroke-width="1.3"/><text x="722" y="89" font-size="12.5" font-weight="600" fill="#172331" text-anchor="start">Draw a candidate at the peak rate</text><text x="722" y="105.5" font-size="11" fill="#556270" text-anchor="start">t = t - ln(1 - U) / lambda_max, U ~ Uniform(0, 1)</text></g><g><path d="M890,124 L890,146" fill="none" stroke="#5d6b7a" stroke-width="1.4" marker-end="url(#arrow)" stroke-linejoin="round"/></g><g><circle cx="690" cy="168" r="10" fill="#172331" stroke="#172331" stroke-width="1.2"/><text x="690" y="172" font-size="11" font-weight="600" fill="#ffffff" text-anchor="middle">2</text></g><g><rect x="710" y="146" width="360" height="62" rx="8" fill="#eef4fd" stroke="#9dbbe8" stroke-width="1.3"/><text x="722" y="173" font-size="12.5" font-weight="600" fill="#172331" text-anchor="start">Keep it with probability lambda(t) / lambda_max</text><text x="722" y="189.5" font-size="11" fill="#556270" text-anchor="start">a second uniform number decides</text></g><g><path d="M890,208 L890,230" fill="none" stroke="#5d6b7a" stroke-width="1.4" marker-end="url(#arrow)" stroke-linejoin="round"/></g><g><circle cx="690" cy="252" r="10" fill="#172331" stroke="#172331" stroke-width="1.2"/><text x="690" y="256" font-size="11" font-weight="600" fill="#ffffff" text-anchor="middle">3</text></g><g><rect x="710" y="230" width="360" height="62" rx="8" fill="#eef4fd" stroke="#9dbbe8" stroke-width="1.3"/><text x="722" y="257" font-size="12.5" font-weight="600" fill="#172331" text-anchor="start">Repeat until t passes closing time T</text><text x="722" y="273.5" font-size="11" fill="#556270" text-anchor="start">kept candidates are the arrival times</text></g><text x="690" y="330" font-size="11.5" fill="#556270" font-weight="400" text-anchor="start"><tspan x="690" dy="0">With the constant profile every candidate is kept, which is the</tspan><tspan x="690" dy="15">ordinary Poisson process: exponential gaps with mean 1/lambda.</tspan><tspan x="690" dy="15">All arrival times are generated from the seed before the run</tspan><tspan x="690" dy="15">starts.</tspan></text></svg>