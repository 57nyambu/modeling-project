<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 470" width="1100" height="470" role="img" aria-labelledby="arrival-process-t arrival-process-d" font-family="&quot;IBM Plex Sans&quot;, &quot;Segoe UI&quot;, system-ui, -apple-system, sans-serif"><title id="arrival-process-t">Arrival process</title><desc id="arrival-process-d">Arrival rate over the run for the constant and midday-peak profiles, and how the thinning method generates arrivals for a changing rate.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#5d6b7a"/></marker><marker id="arrow-strong" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#172331"/></marker><marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#257de0"/></marker></defs><rect x="0" y="0" width="1100" height="470" fill="#ffffff"/><text x="30" y="34" font-size="13.5" font-weight="600" fill="#172331" text-anchor="start">Arrival rate over the run</text><text x="30" y="54" font-size="11.5" font-weight="400" fill="#556270" text-anchor="start">lambda(t) = lambda ((1 - A/2) + A sin^2(pi t / T)), here lambda = 1.4/min and A = 1</text><g><line x1="80" x2="620" y1="380" y2="380" stroke="#eef1f4"/><text x="72" y="384" font-size="10.5" font-weight="400" fill="#556270" text-anchor="end">0</text></g><g><line x1="80" x2="620" y1="251.63561076604552" y2="251.63561076604552" stroke="#eef1f4"/><text x="72" y="255.63561076604552" font-size="10.5" font-weight="400" fill="#556270" text-anchor="end">1</text></g><g><line x1="80" x2="620" y1="123.27122153209103" y2="123.27122153209103" stroke="#eef1f4"/><text x="72" y="127.27122153209103" font-size="10.5" font-weight="400" fill="#556270" text-anchor="end">2</text></g><path d="M80.0,290.1L84.5,290.0L89.0,289.7L