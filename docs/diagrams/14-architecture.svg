<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 560" width="1100" height="560" role="img" aria-labelledby="software-architecture-t software-architecture-d" font-family="&quot;IBM Plex Sans&quot;, &quot;Segoe UI&quot;, system-ui, -apple-system, sans-serif"><title id="software-architecture-t">Software architecture</title><desc id="software-architecture-d">The React interface in the browser talks to the Django API over HTTP and JSON; Django calls the pure-Python simulation engine, stores results in SQLite and draws report figures with Matplotlib.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#5d6b7a"/></marker><marker id="arrow-strong" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#172331"/></marker><marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#257de0"/></marker></defs><rect x="0" y="0" width="1100" height="560" fill="#ffffff"/><g><rect x="30" y="30" width="300" height="400" rx="10" fill="#fafbfc" stroke="#d5dbe2" stroke-width="1.2"/><text x="44" y="52" font-size="12.5" font-weight="600" fill="#556270" text-anchor="start">Browser: React + TypeScript (web/)</text></g><g><rect x="52" y="70" width="256" height="112" rx="8" fill="#eef4fd" stroke="#9dbbe8" stroke-width="1.3"/><text x="64" y="97.25" font-size="12.5" font-weight="600" fill="#172331" text-anchor="start">Pages</text><text x="64" y="113.75" font-size="11" fill="#556270" text-anchor="start">Simulation</text><text x="64" y="130.25" font-size="11" fill="#556270" text-anchor="start">Compare strategies</text><text x="64" y="146.75" font-size="11" fill="#556270" text-anchor="start">How the model works</text><text x="64" y="163.25" font-size="11" fill="#556270" text-anchor="start">Validation and Saved results</text></g><g><rect x="52" y="196" width="256" height="66" rx="8" fill="#eef4fd" stroke="#9dbbe8" stroke-width="1.3"/><text x="64" y="225" font-size="12.5" font-weight="600" fill="#172331" text-anchor="start">Floor-plan replay</text><text x="64" y="241.5" font-size="11" fill="#556270" text-anchor="start">canvas animation of the event trace</text></g><g><rect x="52" y="276" width="256" height="66" rx="8" fill="#eef4fd" stroke="#9dbbe8" stroke-width="1.3"/><text x="64" y="305" font-size="12.5" font-weight="600" fill="#172331" text-anchor="start">Charts and diagrams</text><text x="64" y="321.5" font-size="11" fill="#556270" text-anchor="start">SVG, drawn in the browser</text></g><g><rect x="52" y="356" width="256" height="52" rx="8" fill="#f5f7f9" stroke="#b5bec8" stroke-width="1.3"/><text x="64" y="378" font-size="12.5" font-weight="600" fill="#172331" text-anchor="start">api.ts</text><text x="64" y="394.5" font-size="11" fill="#556270" text-anchor="start">typed calls to /api/...</text></g><g><rect x="372" y="150" width="170" height="98" rx="8" fill="#ffffff" stroke="#d5dbe2" stroke-width="1.3"/><text x="457" y="178.5" font-size="12.5" font-weight="600" fill="#172331" text-anchor="middle">Vite dev server</text><text x="457" y="195" font-size="11" fill="#556270" text-anchor="middle">port 5173</text><text x="457" y="211.5" font-size="11" fill="#556270" text-anchor="middle">forwards /api</text><text x="457" y="228" font-size="11" fill="#556270" text-anchor="middle">to Django</text></g><text x="372" y="280" font-size="11" fill="#556270" font-weight="400" text-anchor="start"><tspan x="372" dy="0">Single-server mode: after npm</tspan><tspan x="372" dy="15">run build, Django serves the</tspan><tspan x="372" dy="15">built app itself on port 8000.</tspan></text><g><rect x="584" y="30" width="250" height="400" rx="10" fill="#fafbfc" stroke="#d5dbe2" stroke-width="1.2"/><text x="598" y="52" font-size="12.5" font-weight="600" fill="#556270" text-anchor="start">Django API (api/simulator)</text></g><g><rect x="604" y="70" width="210" height="112" rx="8" fill="#eef4fd" stroke="#9dbbe8" stroke-width="1.3"/><text x="616" y="105.5" font-size="12.5" font-weight="600" fill="#172331" text-anchor="start">views.py</text><text x="616" y="122" font-size="11" fill="#556270" text-anchor="start">/api/runs</text><text x="616" y="138.5" font-size="11" fill="#556270" text-anchor="start">/api/comparisons</text><text x="616" y="155" font-size="11" fill="#556270" text-anchor="start">/api/validation, /api/meta</text></g><g><rect x="604" y="196" width="210" height="66" rx="8" fill="#eef4fd" stroke="#9dbbe8" stroke-width="1.3"/><text x="616" y="225" font-size="12.5" font-weight="600" fill="#172331" text-anchor="start">charts.py</text><text x="616" y="241.5" font-size="11" fill="#556270" text-anchor="start">Matplotlib PNG figures</text></g><g><rect x="604" y="276" width="210" height="66" rx="8" fill="#eef4fd" stroke="#9dbbe8" stroke-width="1.3"/><text x="616" y="305" font-size="12.5" font-weight="600" fill="#172331" text-anchor="start">models.py</text><text x="616" y="321.5" font-size="11" fill="#556270" text-anchor="start">runs and comparisons</text></g><g><rect x="870" y="30" width="200" height="400" rx="10" fill="#fafbfc" stroke="#d5dbe2" stroke-width="1.2"/><text x="884" y="52" font-size="12.5" font-weight="600" fill="#556270" text-anchor="start">Engine (api/simulation)</text></g><g><rect x="888" y="70" width="164" height="340" rx="8" fill="#172331" stroke="#172331" stroke-width="1.3"/><text x="900" y="145.25" font-size="12.5" font-weight="600" fill="#ffffff" text-anchor="start">Pure Python</text><text x="900" y="161.75" font-size="11" fill="#c9d2dc" text-anchor="start">config.py</text><text x="900" y="178.25" font-size="11" fill="#c9d2dc" text-anchor="start">layout.py</text><text x="900" y="194.75" font-size="11" fill="#c9d2dc" text-anchor="start">customers.py</text><text x="900" y="211.25" font-size="11" fill="#c9d2dc" text-anchor="start">engine.py</text><text x="900" y="227.75" font-size="11" fill="#c9d2dc" text-anchor="start">strategies.py</text><text x="900" y="244.25" font-size="11" fill="#c9d2dc" text-anchor="start">metrics.py</text><text x="900" y="260.75" font-size="11" fill="#c9d2dc" text-anchor="start">comparison.py</text><text x="900" y="277.25" font-size="11" fill="#c9d2dc" text-anchor="start">validation.py</text><text x="900" y="293.75" font-size="11" fill="#c9d2dc" text-anchor="start">cli.py</text><text x="900" y="310.25" font-size="11" fill="#c9d2dc" text-anchor="start"/><text x="900" y="326.75" font-size="11" fill="#c9d2dc" text-anchor="start">NumPy and Pandas</text><text x="900" y="343.25" font-size="11" fill="#c9d2dc" text-anchor="start">no Django imports</text></g><g><path d="M634,461V531A75,9 0 0 0 784,531V461" fill="#f5f7f9" stroke="#b5bec8" stroke-width="1.3"/><ellipse cx="709" cy="461" rx="75" ry="9" fill="#f5f7f9" stroke="#b5bec8" stroke-width="1.3"/><text x="709" y="487" font-size="13" font-weight="600" fill="#172331" text-anchor="middle">SQLite</text><text x="709" y="505" font-size="11" font-weight="400" fill="#556270" text-anchor="middle">db.sqlite3</text></g><g><path d="M308,382 L348,382 L348,210 L372,210" fill="none" stroke="#5d6b7a" stroke-width="1.4" marker-end="url(#arrow)" marker-start="url(#arrow)" stroke-linejoin="round"/></g><g><rect x="422.97" y="130.5" width="68.06" height="15.5" rx="3" fill="#ffffff"/><text x="457" y="141" font-size="10.5" fill="#556270" text-anchor="middle" font-weight="400">HTTP + JSON</text></g><g><path d="M542,199 L604,126" fill="none" stroke="#5d6b7a" stroke-width="1.4" marker-end="url(#arrow)" marker-start="url(#arrow)" stroke-linejoin="round"/></g><g><path d="M814,126 L888,126" fill="none" stroke="#172331" stroke-width="1.8" marker-end="url(#arrow-strong)" stroke-linejoin="round"/></g><g><rect x="833.35" y="104.5" width="35.3" height="15.5" rx="3" fill="#ffffff"/><text x="851" y="115" font-size="10.5" fill="#556270" text-anchor="middle" font-weight="400">calls</text></g><g><path d="M709,342 L709,452" fill="none" stroke="#5d6b7a" stroke-width="1.4" marker-end="url(#arrow)" marker-start="url(#arrow)" stroke-linejoin="round"/></g><g><rect x="712" y="394.5" width="133.57999999999998" height="15.5" rx="3" fill="#ffffff"/><text x="716" y="405" font-size="10.5" fill="#556270" text-anchor="start" font-weight="400">save and reload results</text></g><text x="30" y="470" font-size="11.5" fill="#556270" font-weight="400" text-anchor="start"><tspan x="30" dy="0">The engine never imports Django, so it runs on its own from the command line (python -m</tspan><tspan x="30" dy="15">simulation.cli) and its unit tests need no web server. Django only validates input, calls the</tspan><tspan x="30" dy="15">engine, stores results and serves them.</tspan></text></svg>