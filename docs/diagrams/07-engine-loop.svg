<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 720" width="1100" height="720" role="img" aria-labelledby="next-event-time-advance-t next-event-time-advance-d" font-family="&quot;IBM Plex Sans&quot;, &quot;Segoe UI&quot;, system-ui, -apple-system, sans-serif"><title id="next-event-time-advance-t">Next-event time advance</title><desc id="next-event-time-advance-d">The engine's main loop: initialise, repeatedly take the earliest event, advance the clock, update the statistics and run the event handler, until the next event is after closing time; then close the statistics and compute the measures.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#5d6b7a"/></marker><marker id="arrow-strong" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#172331"/></marker><marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#257de0"/></marker></defs><rect x="0" y="0" width="1100" height="720" fill="#ffffff"/><g><rect x="200" y="20" width="200" height="34" rx="17" fill="#ffffff" stroke="#172331" stroke-width="1.8"/><text x="300" y="41.333333333333336" font-size="13" font-weight="600" fill="#172331" text-anchor="middle">Start a run</text></g><g><path d="M300,54 L300,80" fill="none" stroke="#5d6b7a" stroke-width="1.4" marker-end="url(#arrow)" stroke-linejoin="round"/></g><g><rect x="130" y="80" width="340" height="66" rx="8" fill="#eef4fd" stroke="#9dbbe8" stroke-width="1.3"/><text x="300" y="100.5" font-size="13" font-weight="600" fill="#172331" text-anchor="middle">Initialise</text><text x="300" y="117.5" font-size="11.5" fill="#556270" text-anchor="middle">generate every customer from the seed</text><text x="300" y="134.5" font-size="11.5" fill="#556270" text-anchor="middle">schedule each ARRIVAL; set the clock t = 0</text></g><g><path d="M300,146 L300,174" fill="none" stroke="#5d6b7a" stroke-width="1.4" marker-end="url(#arrow)" stroke-linejoin="round"/></g><g><path d="M300,174L450,226L300,278L150,226Z" fill="#fff7e0" stroke="#e0b43c" stroke-width="1.3" stroke-linejoin="round"/><text x="300" y="222.5" font-size="12" font-weight="600" fill="#172331" text-anchor="middle">Next event after closing</text><text x="300" y="237.5" font-size="12" font-weight="400" fill="#172331" text-anchor="middle">time T, or no events left?</text></g><g><path d="M300,278 L300,306" fill="none" stroke="#5d6b7a" stroke-width="1.4" marker-end="url(#arrow)" stroke-linejoin="round"/><g><rect x="314" y="286" width="19.44" height="16" rx="3" fill="#ffffff"/><text x="318" y="297" font-size="11" fill="#556270" text-anchor="start" font-weight="400">no</text></g></g><g><rect x="130" y="306" width="340" height="62" rx="8" fill="#eef4fd" stroke="#9dbbe8" stroke-width="1.3"/><text x="300" y="333" font-size="13" font-weight="600" fill="#172331" text-anchor="middle">Take the earliest event</text><text x="300" y="350" font-size="11.5" fill="#556270" text-anchor="middle">ties: event priority, then scheduling order</text></g><g><path d="M300,368 L300,390" fill="none" stroke="#5d6b7a" stroke-width="1.4" marker-end="url(#arrow)" stroke-linejoin="round"/></g><g><rect x="130" y="390" width="340" height="62" rx="8" fill="#eef4fd" stroke="#9dbbe8" stroke-width="1.3"/><text x="300" y="417" font-size="13" font-weight="600" fill="#172331" text-anchor="middle">Advance the clock</text><text x="300" y="434" font-size="11.5" fill="#556270" text-anchor="middle">t = event time: the clock jumps</text></g><g><path d="M300,452 L300,474" fill="none" stroke="#5d6b7a" stroke-width="1.4" marker-end="url(#arrow)" stroke-linejoin="round"/></g><g><rect x="130" y="474" width="340" height="62" rx="8" fill="#eef4fd" stroke="#9dbbe8" stroke-width="1.3"/><text x="300" y="501" font-size="13" font-weight="600" fill="#172331" text-anchor="middle">Update time-weighted areas</text><text x="300" y="518" font-size="11.5" fill="#556270" text-anchor="middle">area += Q_c x (t - time of last change)</text></g><g><path d="M300,536 L300,558" fill="none" stroke="#5d6b7a" stroke-width="1.4" marker-end="url(#arrow)" stroke-linejoin="round"/></g><g><rect x="130" y="558" width="340" height="62" rx="8" fill="#172331" stroke="#172331" stroke-width="1.3"/><text x="300" y="585" font-size="13" font-weight="600" fill="#ffffff" text-anchor="middle">Run the event's handler</text><text x="300" y="602" font-size="11.5" fill="#c9d2dc" text-anchor="middle">change the state, schedule new events</text></g><g><path d="M130,589 L60,589 L60,226 L150,226" fill="none" stroke="#5d6b7a" stroke-width="1.4" marker-end="url(#arrow)" stroke-linejoin="round"/></g><g><rect x="38.84" y="400" width="42.32" height="16" rx="3" fill="#ffffff"/><text x="60" y="411" font-size="11" fill="#556270" text-anchor="middle" font-weight="400">repeat</text></g><g><path d="M450,226 L560,226" fill="none" stroke="#5d6b7a" stroke-width="1.4" marker-end="url(#arrow)" stroke-linejoin="round"/><g><rect x="492.42" y="208" width="25.16" height="16" rx="3" fill="#ffffff"/><text x="505" y="219" font-size="11" fill="#556270" text-anchor="middle" font-weight="400">yes</text></g></g><g><rect x="560" y="193" width="280" height="66" rx="8" fill="#eef4fd" stroke="#9dbbe8" stroke-width="1.3"/><text x="700" y="213.5" font-size="13" font-weight="600" fill="#172331" text-anchor="middle">Close the run at T</text><text x="700" y="230.5" font-size="11.5" fill="#556270" text-anchor="middle">add the final areas; count busy time</text><text x="700" y="247.5" font-size="11.5" fill="#556270" text-anchor="middle">only up to T</text></g><g><path d="M700,259 L700,290" fill="none" stroke="#5d6b7a" stroke-width="1.4" marker-end="url(#arrow)" stroke-linejoin="round"/></g><g><rect x="560" y="290" width="280" height="62" rx="8" fill="#eef4fd" stroke="#9dbbe8" stroke-width="1.3"/><text x="700" y="317" font-size="13" font-weight="600" fill="#172331" text-anchor="middle">Compute the measures</text><text x="700" y="334" font-size="11.5" fill="#556270" text-anchor="middle">waits, queues, utilisation, ...</text></g><g><path d="M700,352 L700,380" fill="none" stroke="#5d6b7a" stroke-width="1.4" marker-end="url(#arrow)" stroke-linejoin="round"/></g><g><rect x="600" y="380" width="200" height="34" rx="17" fill="#ffffff" stroke="#172331" stroke-width="1.8"/><text x="700" y="401.3333333333333" font-size="13" font-weight="600" fill="#172331" text-anchor="middle">Results</text></g><text x="900" y="208" font-size="12.5" font-weight="600" fill="#556270" text-anchor="start">Event list (a priority queue)</text><rect x="892" y="218" width="190" height="160" rx="8" fill="#ffffff" stroke="#d5dbe2"/><g><rect x="897" y="223" width="180" height="28" rx="5" fill="#eef4fd"/><text x="906" y="242" font-size="11" font-weight="400" fill="#556270" text-anchor="start" font-family="&quot;IBM Plex Mono&quot;, Consolas, ui-monospace, monospace">4.00</text><text x="946" y="242" font-size="11" font-weight="600" fill="#172331" text-anchor="start" font-family="&quot;IBM Plex Mono&quot;, Consolas, ui-monospace, monospace">SERVICE_END</text><text x="1072" y="242" font-size="11" font-weight="400" fill="#556270" text-anchor="end" font-family="&quot;IBM Plex Mono&quot;, Consolas, ui-monospace, monospace">C1</text></g><g><text x="906" y="272" font-size="11" font-weight="400" fill="#556270" text-anchor="start" font-family="&quot;IBM Plex Mono&quot;, Consolas, ui-monospace, monospace">4.62</text><text x="946" y="272" font-size="11" font-weight="400" fill="#172331" text-anchor="start" font-family="&quot;IBM Plex Mono&quot;, Consolas, ui-monospace, monospace">SECTION_DEPART</text><text x="1072" y="272" font-size="11" font-weight="400" fill="#556270" text-anchor="end" font-family="&quot;IBM Plex Mono&quot;, Consolas, ui-monospace, monospace">C7</text></g><g><text x="906" y="302" font-size="11" font-weight="400" fill="#556270" text-anchor="start" font-family="&quot;IBM Plex Mono&quot;, Consolas, ui-monospace, monospace">5.10</text><text x="946" y="302" font-size="11" font-weight="400" fill="#172331" text-anchor="start" font-family="&quot;IBM Plex Mono&quot;, Consolas, ui-monospace, monospace">ARRIVAL</text><text x="1072" y="302" font-size="11" font-weight="400" fill="#556270" text-anchor="end" font-family="&quot;IBM Plex Mono&quot;, Consolas, ui-monospace, monospace">C9</text></g><g><text x="906" y="332" font-size="11" font-weight="400" fill="#556270" text-anchor="start" font-family="&quot;IBM Plex Mono&quot;, Consolas, ui-monospace, monospace">5.31</text><text x="946" y="332" font-size="11" font-weight="400" fill="#172331" text-anchor="start" font-family="&quot;IBM Plex Mono&quot;, Consolas, ui-monospace, monospace">CHECKOUT_ARRIVE</text><text x="1072" y="332" font-size="11" font-weight="400" fill="#556270" text-anchor="end" font-family="&quot;IBM Plex Mono&quot;, Consolas, ui-monospace, monospace">C4</text></g><g><text x="906" y="362" font-size="11" font-weight="400" fill="#556270" text-anchor="start" font-family="&quot;IBM Plex Mono&quot;, Consolas, ui-monospace, monospace">6.85</text><text x="946" y="362" font-size="11" font-weight="400" fill="#172331" text-anchor="start" font-family="&quot;IBM Plex Mono&quot;, Consolas, ui-monospace, monospace">SECTION_ARRIVE</text><text x="1072" y="362" font-size="11" font-weight="400" fill="#556270" text-anchor="end" font-family="&quot;IBM Plex Mono&quot;, Consolas, ui-monospace, monospace">C8</text></g><text x="892" y="400" font-size="11.5" fill="#556270" font-weight="400" text-anchor="start"><tspan x="892" dy="0">The earliest event is always</tspan><tspan x="892" dy="15">taken next. Nothing happens</tspan><tspan x="892" dy="15">between events, so no time is</tspan><tspan x="892" dy="15">spent simulating idle moments.</tspan></text></svg>