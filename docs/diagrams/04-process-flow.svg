<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 760" width="1100" height="760" role="img" aria-labelledby="customer-process-flow-t customer-process-flow-d" font-family="&quot;IBM Plex Sans&quot;, &quot;Segoe UI&quot;, system-ui, -apple-system, sans-serif"><title id="customer-process-flow-t">Customer process flow</title><desc id="customer-process-flow-d">Flowchart of one customer: arrive, walk to and shop in each section on the route, walk to the checkout, let the strategy choose a counter, wait if it is busy, be served and leave.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#5d6b7a"/></marker><marker id="arrow-strong" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#172331"/></marker><marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#257de0"/></marker></defs><rect x="0" y="0" width="1100" height="760" fill="#ffffff"/><g><rect x="220" y="30" width="220" height="34" rx="17" fill="#ffffff" stroke="#172331" stroke-width="1.8"/><text x="330" y="51.333333333333336" font-size="13" font-weight="600" fill="#172331" text-anchor="middle">Customer arrives</text></g><g><path d="M330,64 L330,96" fill="none" stroke="#5d6b7a" stroke-width="1.4" marker-end="url(#arrow)" stroke-linejoin="round"/></g><g><rect x="210" y="96" width="240" height="46" rx="8" fill="#eef4fd" stroke="#9dbbe8" stroke-width="1.3"/><text x="330" y="123.5" font-size="13" font-weight="600" fill="#172331" text-anchor="middle">Walk to the first section</text></g><g><path d="M330,142 L330,172" fill="none" stroke="#5d6b7a" stroke-width="1.4" marker-end="url(#arrow)" stroke-linejoin="round"/></g><g><rect x="210" y="172" width="240" height="46" rx="8" fill="#eef4fd" stroke="#9dbbe8" stroke-width="1.3"/><text x="330" y="199.5" font-size="13" font-weight="600" fill="#172331" text-anchor="middle">Pick this section's items</text></g><g><path d="M330,218 L330,238" fill="none" stroke="#5d6b7a" stroke-width="1.4" marker-end="url(#arrow)" stroke-linejoin="round"/></g><g><path d="M330,238L450,276L330,314L210,276Z" fill="#fff7e0" stroke="#e0b43c" stroke-width="1.3" stroke-linejoin="round"/><text x="330" y="272.5" font-size="12" font-weight="600" fill="#172331" text-anchor="middle">More sections</text><text x="330" y="287.5" font-size="12" font-weight="400" fill="#172331" text-anchor="middle">on the route?</text></g><g><path d="M450,276 L500,276" fill="none" stroke="#5d6b7a" stroke-width="1.4" marker-end="url(#arrow)" stroke-linejoin="round"/><g><rect x="447.42" y="270" width="25.16" height="16" rx="3" fill="#ffffff"/><text x="460" y="281" font-size="11" fill="#556270" text-anchor="middle" font-weight="400">yes</text></g></g><g><rect x="500" y="253" width="190" height="46" rx="8" fill="#eef4fd" stroke="#9dbbe8" stroke-width="1.3"/><text x="595" y="280.25" font-size="12.5" font-weight="600" fill="#172331" text-anchor="middle">Walk to the next section</text></g><g><path d="M595,253 L595,195 L450,195" fill="none" stroke="#5d6b7a" stroke-width="1.4" marker-end="url(#arrow)" stroke-linejoin="round"/></g><g><path d="M330,314 L330,340" fill="none" stroke="#5d6b7a" stroke-width="1.4" marker-end="url(#arrow)" stroke-linejoin="round"/><g><rect x="344" y="320" width="19.44" height="16" rx="3" fill="#ffffff"/><text x="348" y="331" font-size="11" fill="#556270" text-anchor="start" font-weight="400">no</text></g></g><g><rect x="210" y="340" width="240" height="46" rx="8" fill="#eef4fd" stroke="#9dbbe8" stroke-width="1.3"/><text x="330" y="367.5" font-size="13" font-weight="600" fill="#172331" text-anchor="middle">Walk to the checkout area</text></g><g><path d="M330,386 L330,410" fill="none" stroke="#5d6b7a" stroke-width="1.4" marker-end="url(#arrow)" stroke-linejoin="round"/></g><g><rect x="210" y="410" width="240" height="46" rx="8" fill="#fff7e0" stroke="#e0b43c" stroke-width="1.3"/><text x="330" y="437.5" font-size="13" font-weight="600" fill="#172331" text-anchor="middle">Strategy chooses counter c</text></g><g><path d="M330,456 L330,472" fill="none" stroke="#5d6b7a" stroke-width="1.4" marker-end="url(#arrow)" stroke-linejoin="round"/></g><g><path d="M330,472L455,512L330,552L205,512Z" fill="#fff7e0" stroke="#e0b43c" stroke-width="1.3" stroke-linejoin="round"/><text x="330" y="508.5" font-size="12" font-weight="600" fill="#172331" text-anchor="middle">Counter c free and</text><text x="330" y="523.5" font-size="12" font-weight="400" fill="#172331" text-anchor="middle">queue empty?</text></g><g><path d="M205,512 L196,512" fill="none" stroke="#5d6b7a" stroke-width="1.4" marker-end="url(#arrow)" stroke-linejoin="round"/><g><rect x="204.28" y="494" width="19.44" height="16" rx="3" fill="#ffffff"/><text x="214" y="505" font-size="11" fill="#556270" text-anchor="middle" font-weight="400">no</text></g></g><g><rect x="20" y="489" width="176" height="46" rx="8" fill="#eef4fd" stroke="#9dbbe8" stroke-width="1.3"/><text x="108" y="516.25" font-size="12.5" font-weight="600" fill="#172331" text-anchor="middle">Join the end of queue c</text></g><g><path d="M108,535 L108,560" fill="none" stroke="#5d6b7a" stroke-width="1.4" marker-end="url(#arrow)" stroke-linejoin="round"/></g><g><rect x="20" y="560" width="176" height="46" rx="8" fill="#eef4fd" stroke="#9dbbe8" stroke-width="1.3"/><text x="108" y="579" font-size="12.5" font-weight="600" fill="#172331" text-anchor="middle">Wait for the cashier</text><text x="108" y="595.5" font-size="11" fill="#556270" text-anchor="middle">first in, first out</text></g><g><path d="M108,606 L108,623 L210,623" fill="none" stroke="#5d6b7a" stroke-width="1.4" marker-end="url(#arrow)" stroke-linejoin="round"/></g><g><path d="M330,552 L330,600" fill="none" stroke="#5d6b7a" stroke-width="1.4" marker-end="url(#arrow)" stroke-linejoin="round"/><g><rect x="346" y="572" width="25.16" height="16" rx="3" fill="#ffffff"/><text x="350" y="583" font-size="11" fill="#556270" text-anchor="start" font-weight="400">yes</text></g></g><g><rect x="210" y="600" width="240" height="46" rx="8" fill="#e9f7f1" stroke="#74c7a5" stroke-width="1.3"/><text x="330" y="627.5" font-size="13" font-weight="600" fill="#172331" text-anchor="middle">Scan the items and pay</text></g><g><path d="M330,646 L330,676" fill="none" stroke="#5d6b7a" stroke-width="1.4" marker-end="url(#arrow)" stroke-linejoin="round"/></g><g><rect x="220" y="676" width="220" height="34" rx="17" fill="#ffffff" stroke="#172331" stroke-width="1.8"/><text x="330" y="697.3333333333334" font-size="13" font-weight="600" fill="#172331" text-anchor="middle">Customer leaves</text></g><line x1="740" x2="740" y1="30" y2="700" stroke="#d5dbe2"/><text x="760" y="22" font-size="12.5" font-weight="600" fill="#556270" text-anchor="start">How long each step takes</text><g><line x1="736" x2="744" y1="47" y2="47" stroke="#8793a0"/><text x="760" y="45" font-size="12.5" font-weight="600" fill="#172331" text-anchor="start">Arrivals</text><text x="760" y="61" font-size="11.5" fill="#556270" font-weight="400" text-anchor="start"><tspan x="760" dy="0">Time between arrivals ~ Exponential, mean 1/lambda</tspan></text></g><g><line x1="736" x2="744" y1="119" y2="119" stroke="#8793a0"/><text x="760" y="117" font-size="12.5" font-weight="600" fill="#172331" text-anchor="start">Walking</text><text x="760" y="133" font-size="11.5" fill="#556270" font-weight="400" text-anchor="start"><tspan x="760" dy="0">route length along the aisles / (60 v), v ~</tspan><tspan x="760" dy="15">Uniform(0.8, 1.4) m/s</tspan></text></g><g><line x1="736" x2="744" y1="195" y2="195" stroke="#8793a0"/><text x="760" y="193" font-size="12.5" font-weight="600" fill="#172331" text-anchor="start">Picking k items</text><text x="760" y="209" font-size="11.5" fill="#556270" font-weight="400" text-anchor="start"><tspan x="760" dy="0">Gamma(k, m_p): the sum of k exponential pick times</tspan></text></g><g><line x1="736" x2="744" y1="363" y2="363" stroke="#8793a0"/><text x="760" y="361" font-size="12.5" font-weight="600" fill="#172331" text-anchor="start">Walking</text><text x="760" y="377" font-size="11.5" fill="#556270" font-weight="400" text-anchor="start"><tspan x="760" dy="0">from the last section to the checkout area</tspan></text></g><g><line x1="736" x2="744" y1="433" y2="433" stroke="#8793a0"/><text x="760" y="431" font-size="12.5" font-weight="600" fill="#172331" text-anchor="start">Choosing</text><text x="760" y="447" font-size="11.5" fill="#556270" font-weight="400" text-anchor="start"><tspan x="760" dy="0">the selected strategy; see the strategies diagram</tspan></text></g><g><line x1="736" x2="744" y1="583" y2="583" stroke="#8793a0"/><text x="760" y="581" font-size="12.5" font-weight="600" fill="#172331" text-anchor="start">Waiting</text><text x="760" y="597" font-size="11.5" fill="#556270" font-weight="400" text-anchor="start"><tspan x="760" dy="0">not an input: it is what the model measures</tspan></text></g><g><line x1="736" x2="744" y1="623" y2="623" stroke="#8793a0"/><text x="760" y="621" font-size="12.5" font-weight="600" fill="#172331" text-anchor="start">Service</text><text x="760" y="637" font-size="11.5" fill="#556270" font-weight="400" text-anchor="start"><tspan x="760" dy="0">Gamma(n, s) scanning + Triangular(a, c, b) payment</tspan></text></g><g><g><rect x="20" y="729" width="16" height="14" rx="7" fill="#ffffff" stroke="#172331" stroke-width="1.6"/><text x="42" y="740" font-size="11" font-weight="400" fill="#556270" text-anchor="start">Start or end</text></g><g><rect x="130.64" y="729" width="16" height="14" rx="3" fill="#eef4fd" stroke="#9dbbe8" stroke-width="1.2"/><text x="152.64" y="740" font-size="11" font-weight="400" fill="#556270" text-anchor="start">Activity or step</text></g><g><path d="M272.15999999999997,728L280.15999999999997,736L272.15999999999997,744L264.15999999999997,736Z" fill="#fff7e0" stroke="#e0b43c"/><text x="286.15999999999997" y="740" font-size="11" font-weight="400" fill="#556270" text-anchor="start">Decision</text></g><g><rect x="351.91999999999996" y="729" width="16" height="14" rx="3" fill="#e9f7f1" stroke="#74c7a5" stroke-width="1.2"/><text x="373.91999999999996" y="740" font-size="11" font-weight="400" fill="#556270" text-anchor="start">Resource</text></g></g></svg>