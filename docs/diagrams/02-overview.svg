<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 520" width="1080" height="520" role="img" aria-labelledby="system-overview-t system-overview-d" font-family="&quot;IBM Plex Sans&quot;, &quot;Segoe UI&quot;, system-ui, -apple-system, sans-serif"><title id="system-overview-t">System overview</title><desc id="system-overview-d">Inputs feed the simulation engine, which produces performance measures, time series, an event trace and charts; experiments change the inputs and run again.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#5d6b7a"/></marker><marker id="arrow-strong" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#172331"/></marker><marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#257de0"/></marker></defs><rect x="0" y="0" width="1080" height="520" fill="#ffffff"/><text x="40" y="44" font-size="13" font-weight="600" fill="#556270" text-anchor="start">Inputs</text><g><rect x="30" y="62" width="220" height="86" rx="8" fill="#f5f7f9" stroke="#b5bec8" stroke-width="1.3"/><text x="140" y="84" font-size="13" font-weight="600" fill="#172331" text-anchor="middle">Parameters</text><text x="140" y="101" font-size="11.5" fill="#556270" text-anchor="middle">arrival rate and run length</text><text x="140" y="118" font-size="11.5" fill="#556270" text-anchor="middle">counters and express counters</text><text x="140" y="135" font-size="11.5" fill="#556270" text-anchor="middle">basket mix, scan and pay times</text></g><g><rect x="30" y="166" width="220" height="70" rx="8" fill="#f5f7f9" stroke="#b5bec8" stroke-width="1.3"/><text x="140" y="188.5" font-size="13" font-weight="600" fill="#172331" text-anchor="middle">Random seed</text><text x="140" y="205.5" font-size="11.5" fill="#556270" text-anchor="middle">drives every random draw</text><text x="140" y="222.5" font-size="11.5" fill="#556270" text-anchor="middle">same seed gives the same day</text></g><g><rect x="30" y="254" width="220" height="86" rx="8" fill="#f5f7f9" stroke="#b5bec8" stroke-width="1.3"/><text x="140" y="276" font-size="13" font-weight="600" fill="#172331" text-anchor="middle">Checkout strategy</text><text x="140" y="293" font-size="11.5" fill="#556270" text-anchor="middle">Shortest Queue, Shortest</text><text x="140" y="310" font-size="11.5" fill="#556270" text-anchor="middle">Estimated Waiting Time, or</text><text x="140" y="327" font-size="11.5" fill="#556270" text-anchor="middle">Express and Normal</text></g><g><rect x="300" y="40" width="470" height="320" rx="10" fill="#fafbfc" stroke="#d5dbe2" stroke-width="1.2"/><text x="314" y="62" font-size="12.5" font-weight="600" fill="#556270" text-anchor="start">Simulation engine (Python package, no Django code)</text></g><g><rect x="326" y="80" width="196" height="70" rx="8" fill="#eef4fd" stroke="#9dbbe8" stroke-width="1.3"/><text x="424" y="102.5" font-size="13" font-weight="600" fill="#172331" text-anchor="middle">Customer generator</text><text x="424" y="119.5" font-size="11.5" fill="#556270" text-anchor="middle">arrivals, baskets, routes</text><text x="424" y="136.5" font-size="11.5" fill="#556270" text-anchor="middle">and service times</text></g><g><rect x="548" y="80" width="196" height="70" rx="8" fill="#172331" stroke="#172331" stroke-width="1.3"/><text x="646" y="111" font-size="13" font-weight="600" fill="#ffffff" text-anchor="middle">Event list and clock</text><text x="646" y="128" font-size="11.5" fill="#c9d2dc" text-anchor="middle">jumps from event to event</text></g><g><rect x="548" y="196" width="196" height="70" rx="8" fill="#e9f7f1" stroke="#74c7a5" stroke-width="1.3"/><text x="646" y="218.5" font-size="13" font-weight="600" fill="#172331" text-anchor="middle">Store state</text><text x="646" y="235.5" font-size="11.5" fill="#556270" text-anchor="middle">queues, cashiers,</text><text x="646" y="252.5" font-size="11.5" fill="#556270" text-anchor="middle">customers in the store</text></g><g><rect x="326" y="196" width="196" height="70" rx="8" fill="#fff7e0" stroke="#e0b43c" stroke-width="1.3"/><text x="424" y="218.5" font-size="13" font-weight="600" fill="#172331" text-anchor="middle">Strategy</text><text x="424" y="235.5" font-size="11.5" fill="#556270" text-anchor="middle">chooses a counter</text><text x="424" y="252.5" font-size="11.5" fill="#556270" text-anchor="middle">at the checkout</text></g><g><rect x="326" y="290" width="418" height="50" rx="8" fill="#eef4fd" stroke="#9dbbe8" stroke-width="1.3"/><text x="535" y="311" font-size="13" font-weight="600" fill="#172331" text-anchor="middle">Measures and statistics</text><text x="535" y="328" font-size="11.5" fill="#556270" text-anchor="middle">time-weighted queue lengths, waits, utilisation</text></g><g><path d="M522,115 L548,115" fill="none" stroke="#5d6b7a" stroke-width="1.4" marker-end="url(#arrow)" stroke-linejoin="round"/></g><g><rect x="507.6" y="95" width="54.800000000000004" height="15" rx="3" fill="#ffffff"/><text x="535" y="105" font-size="10" fill="#556270" text-anchor="middle" font-weight="400">schedules</text></g><g><path d="M628,150 L628,196" fill="none" stroke="#5d6b7a" stroke-width="1.4" marker-end="url(#arrow)" stroke-linejoin="round"/></g><g><path d="M664,196 L664,150" fill="none" stroke="#5d6b7a" stroke-width="1.4" marker-end="url(#arrow)" stroke-linejoin="round"/></g><g><rect x="642" y="167" width="117.2" height="15" rx="3" fill="#ffffff"/><text x="646" y="177" font-size="10" fill="#556270" text-anchor="start" font-weight="400">handlers change state</text></g><g><path d="M548,220 L522,220" fill="none" stroke="#5d6b7a" stroke-width="1.4" marker-end="url(#arrow)" stroke-linejoin="round"/></g><g><path d="M522,244 L548,244" fill="none" stroke="#5d6b7a" stroke-width="1.4" marker-end="url(#arrow)" stroke-linejoin="round"/></g><g><rect x="494.6" y="259" width="80.8" height="15" rx="3" fill="#ffffff"/><text x="535" y="269" font-size="10" fill="#556270" text-anchor="middle" font-weight="400">chosen counter</text></g><g><rect x="515.4" y="199" width="39.2" height="15" rx="3" fill="#ffffff"/><text x="535" y="209" font-size="10" fill="#556270" text-anchor="middle" font-weight="400">queues</text></g><g><path d="M646,266 L646,290" fill="none" stroke="#5d6b7a" stroke-width="1.4" marker-end="url(#arrow)" stroke-linejoin="round"/></g><g><path d="M250,105 L300,105" fill="none" stroke="#5d6b7a" stroke-width="1.4" marker-end="url(#arrow)" stroke-linejoin="round"/></g><g><path d="M250,201 L300,201" fill="none" stroke="#5d6b7a" stroke-width="1.4" marker-end="url(#arrow)" stroke-linejoin="round"/></g><g><path d="M250,297 L300,297" fill="none" stroke="#5d6b7a" stroke-width="1.4" marker-end="url(#arrow)" stroke-linejoin="round"/></g><text x="830" y="44" font-size="13" font-weight="600" fill="#556270" text-anchor="start">Outputs</text><g><rect x="820" y="62" width="230" height="62" rx="8" fill="#f5f7f9" stroke="#b5bec8" stroke-width="1.3"/><text x="935" y="89" font-size="13" font-weight="600" fill="#172331" text-anchor="middle">Performance measures</text><text x="935" y="106" font-size="11.5" fill="#556270" text-anchor="middle">waits, queues, utilisation</text></g><g><rect x="820" y="136" width="230" height="62" rx="8" fill="#f5f7f9" stroke="#b5bec8" stroke-width="1.3"/><text x="935" y="163" font-size="13" font-weight="600" fill="#172331" text-anchor="middle">Time series</text><text x="935" y="180" font-size="11.5" fill="#556270" text-anchor="middle">queue lengths, busy cashiers</text></g><g><rect x="820" y="210" width="230" height="62" rx="8" fill="#f5f7f9" stroke="#b5bec8" stroke-width="1.3"/><text x="935" y="237" font-size="13" font-weight="600" fill="#172331" text-anchor="middle">Event trace</text><text x="935" y="254" font-size="11.5" fill="#556270" text-anchor="middle">drives the floor-plan replay</text></g><g><rect x="820" y="284" width="230" height="62" rx="8" fill="#f5f7f9" stroke="#b5bec8" stroke-width="1.3"/><text x="935" y="311" font-size="13" font-weight="600" fill="#172331" text-anchor="middle">Charts, tables, SQLite</text><text x="935" y="328" font-size="11.5" fill="#556270" text-anchor="middle">dashboards and report figures</text></g><g><path d="M770,93 L820,93" fill="none" stroke="#5d6b7a" stroke-width="1.4" marker-end="url(#arrow)" stroke-linejoin="round"/></g><g><path d="M770,167 L820,167" fill="none" stroke="#5d6b7a" stroke-width="1.4" marker-end="url(#arrow)" stroke-linejoin="round"/></g><g><path d="M770,241 L820,241" fill="none" stroke="#5d6b7a" stroke-width="1.4" marker-end="url(#arrow)" stroke-linejoin="round"/></g><g><path d="M770,315 L820,315" fill="none" stroke="#5d6b7a" stroke-width="1.4" marker-end="url(#arrow)" stroke-linejoin="round"/></g><g><path d="M935,346 L935,420 L140,420 L140,340" fill="none" stroke="#172331" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#arrow-strong)" stroke-linejoin="round"/><g><rect x="364.4" y="414" width="351.2" height="16" rx="3" fill="#ffffff"/><text x="540" y="425" font-size="11" fill="#556270" text-anchor="middle" font-weight="400">Experiment: change one input, run again, compare the outputs</text></g></g><g><g><rect x="40" y="477" width="16" height="14" rx="3" fill="#f5f7f9" stroke="#b5bec8" stroke-width="1.2"/><text x="62" y="488" font-size="11" font-weight="400" fill="#556270" text-anchor="start">Data or input</text></g><g><rect x="156.36" y="477" width="16" height="14" rx="3" fill="#eef4fd" stroke="#9dbbe8" stroke-width="1.2"/><text x="178.36" y="488" font-size="11" font-weight="400" fill="#556270" text-anchor="start">Activity or step</text></g><g><path d="M297.88,476L305.88,484L297.88,492L289.88,484Z" fill="#fff7e0" stroke="#e0b43c"/><text x="311.88" y="488" font-size="11" font-weight="400" fill="#556270" text-anchor="start">Decision</text></g><g><rect x="377.64" y="477" width="16" height="14" rx="3" fill="#e9f7f1" stroke="#74c7a5" stroke-width="1.2"/><text x="399.64" y="488" font-size="11" font-weight="400" fill="#556270" text-anchor="start">Resource</text></g></g></svg>