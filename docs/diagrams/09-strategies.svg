<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 760" width="1120" height="760" role="img" aria-labelledby="checkout-strategy-decision-rules-t checkout-strategy-decision-rules-d" font-family="&quot;IBM Plex Sans&quot;, &quot;Segoe UI&quot;, system-ui, -apple-system, sans-serif"><title id="checkout-strategy-decision-rules-t">Checkout strategy decision rules</title><desc id="checkout-strategy-decision-rules-d">How each of the three strategies chooses a counter, followed by one situation in which all three choose a different counter.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#5d6b7a"/></marker><marker id="arrow-strong" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#172331"/></marker><marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#257de0"/></marker></defs><rect x="0" y="0" width="1120" height="760" fill="#ffffff"/><g><rect x="30" y="26" width="12" height="12" rx="2" fill="#257de0"/><text x="50" y="37" font-size="14" font-weight="600" fill="#172331" text-anchor="start">Shortest Queue</text><text x="30" y="60" font-size="12" fill="#556270" font-weight="400" text-anchor="start"><tspan x="30" dy="0">Join the counter with the fewest customers,</tspan><tspan x="30" dy="15">counting the one being served.</tspan></text></g><g><rect x="400" y="26" width="12" height="12" rx="2" fill="#f47230"/><text x="420" y="37" font-size="14" font-weight="600" fill="#172331" text-anchor="start">Shortest Estimated Waiting Time</text><text x="400" y="60" font-size="12" fill="#556270" font-weight="400" text-anchor="start"><tspan x="400" dy="0">Join the counter expected to start serving you</tspan><tspan x="400" dy="15">soonest, judged from the basket sizes you can see.</tspan></text></g><g><rect x="770" y="26" width="12" height="12" rx="2" fill="#00b894"/><text x="790" y="37" font-size="14" font-weight="600" fill="#172331" text-anchor="start">Express and Normal</text><text x="770" y="60" font-size="12" fill="#556270" font-weight="400" text-anchor="start"><tspan x="770" dy="0">Baskets of 5 items or fewer must use an express</tspan><tspan x="770" dy="15">counter; larger baskets use normal counters.</tspan></text></g><g><rect x="30" y="110" width="320" height="70" rx="8" fill="#eef4fd" stroke="#9dbbe8" stroke-width="1.3"/><text x="190" y="132.5" font-size="13" font-weight="600" fill="#172331" text-anchor="middle">For each counter c</text><text x="190" y="149.5" font-size="11.5" fill="#556270" text-anchor="middle">n_c = customers waiting</text><text x="190" y="166.5" font-size="11.5" fill="#556270" text-anchor="middle">+ 1 if someone is being served</text></g><g><path d="M190,180 L190,214" fill="none" stroke="#5d6b7a" stroke-width="1.4" marker-end="url(#arrow)" stroke-linejoin="round"/></g><g><rect x="30" y="214" width="320" height="60" rx="8" fill="#fff7e0" stroke="#e0b43c" stroke-width="1.3"/><text x="190" y="240" font-size="13" font-weight="600" fill="#172331" text-anchor="middle">Choose the smallest n_c</text><text x="190" y="257" font-size="11.5" fill="#556270" text-anchor="middle">ties go to the lowest counter number</text></g><g><rect x="400" y="110" width="320" height="86" rx="8" fill="#eef4fd" stroke="#9dbbe8" stroke-width="1.3"/><text x="560" y="132" font-size="13" font-weight="600" fill="#172331" text-anchor="middle">For each counter c</text><text x="560" y="149" font-size="11.5" fill="#556270" text-anchor="middle">W_c = expected time left for the customer</text><text x="560" y="166" font-size="11.5" fill="#556270" text-anchor="middle">being served + E[S | n] of everyone waiting</text><text x="560" y="183" font-size="11.5" fill="#556270" text-anchor="middle">E[S | n] = n s + (a + b + c) / 3</text></g><g><path d="M560,196 L560,214" fill="none" stroke="#5d6b7a" stroke-width="1.4" marker-end="url(#arrow)" stroke-linejoin="round"/></g><g><rect x="400" y="214" width="320" height="60" rx="8" fill="#fff7e0" stroke="#e0b43c" stroke-width="1.3"/><text x="560" y="240" font-size="13" font-weight="600" fill="#172331" text-anchor="middle">Choose the smallest W_c</text><text x="560" y="257" font-size="11.5" fill="#556270" text-anchor="middle">true service times stay hidden</text></g><g><path d="M930,107L1035,142L930,177L825,142Z" fill="#fff7e0" stroke="#e0b43c" stroke-width="1.3" stroke-linejoin="round"/><text x="930" y="138.5" font-size="12" font-weight="600" fill="#172331" text-anchor="middle">5 items</text><text x="930" y="153.5" font-size="12" font-weight="400" fill="#172331" text-anchor="middle">or fewer?</text></g><g><path d="M825,142 L800,142 L800,214" fill="none" stroke="#5d6b7a" stroke-width="1.4" marker-end="url(#arrow)" stroke-linejoin="round"/><g><rect x="795.42" y="122" width="25.16" height="16" rx="3" fill="#ffffff"/><text x="808" y="133" font-size="11" fill="#556270" text-anchor="middle" font-weight="400">yes</text></g></g><g><path d="M1035,142 L1060,142 L1060,214" fill="none" stroke="#5d6b7a" stroke-width="1.4" marker-end="url(#arrow)" stroke-linejoin="round"/><g><rect x="1042.28" y="122" width="19.44" height="16" rx="3" fill="#ffffff"/><text x="1052" y="133" font-size="11" fill="#556270" text-anchor="middle" font-weight="400">no</text></g></g><g><rect x="770" y="214" width="140" height="44" rx="8" fill="#eef4fd" stroke="#9dbbe8" stroke-width="1.3"/><text x="840" y="240" font-size="12" font-weight="600" fill="#172331" text-anchor="middle">Express counters</text></g><g><rect x="950" y="214" width="140" height="44" rx="8" fill="#eef4fd" stroke="#9dbbe8" stroke-width="1.3"/><text x="1020" y="240" font-size="12" font-weight="600" fill="#172331" text-anchor="middle">Normal counters</text></g><g><path d="M840,258 L840,280 L930,280 L930,296" fill="none" stroke="#5d6b7a" stroke-width="1.4" marker-end="url(#arrow)" stroke-linejoin="round"/></g><g><path d="M1020,258 L1020,280 L930,280" fill="none" stroke="#5d6b7a" stroke-width="1.4" marker-end="url(#arrow)" stroke-linejoin="round"/></g><g><rect x="790" y="296" width="280" height="52" rx="8" fill="#fff7e0" stroke="#e0b43c" stroke-width="1.3"/><text x="930" y="318" font-size="12.5" font-weight="600" fill="#172331" text-anchor="middle">Fewest customers in that group</text><text x="930" y="334.5" font-size="11" fill="#556270" text-anchor="middle">a group with no counters: use all</text></g><rect x="30" y="378" width="1060" height="356" rx="10" fill="#f8f9fb" stroke="#e2e6eb"/><text x="50" y="408" font-size="13.5" font-weight="600" fill="#172331" text-anchor="start">Example: a customer with 4 items reaches the checkout</text><text x="50" y="428" font-size="11.5" font-weight="400" fill="#556270" text-anchor="start">Numbers inside circles are basket sizes. Here s = 0.05 min per item and the average payment is 1.17 min.</text><text x="600" y="462" font-size="11.5" font-weight="600" fill="#556270" text-anchor="start">Customers n_c</text><text x="720" y="462" font-size="11.5" font-weight="600" fill="#556270" text-anchor="start">Expected wait W_c (min)</text><text x="930" y="462" font-size="11.5" font-weight="600" fill="#556270" text-anchor="start">Chosen by</text><g><text x="50" y="504" font-size="12.5" font-weight="600" fill="#172331" text-anchor="start">Counter 1</text><text x="50" y="522" font-size="11" font-weight="400" fill="#556270" text-anchor="start">express in Strategy 3</text><rect x="470" y="482" width="84" height="36" rx="6" fill="#172331"/><text x="512" y="505" font-size="11.5" font-weight="600" fill="#ffffff" text-anchor="middle">till</text><circle cx="440" cy="500" r="15" fill="#6a4ce2" stroke="#172331" stroke-width="2.2"/><text x="440" y="504" font-size="11" font-weight="600" fill="#ffffff" text-anchor="middle">5</text><text x="440" y="530" font-size="10" font-weight="400" fill="#556270" text-anchor="middle">1.22 min left</text><g><circle cx="396" cy="500" r="15" fill="#a99af3" stroke="#ffffff" stroke-width="2"/><text x="396" y="504" font-size="11" font-weight="600" fill="#172331" text-anchor="middle">3</text></g><g><circle cx="358" cy="500" r="15" fill="#a99af3" stroke="#ffffff" stroke-width="2"/><text x="358" y="504" font-size="11" font-weight="600" fill="#172331" text-anchor="middle">4</text></g><text x="600" y="505" font-size="13" font-weight="600" fill="#172331" text-anchor="start">3</text><text x="720" y="505" font-size="12" font-weight="400" fill="#556270" text-anchor="start">1.217 + 1.317 + 1.367 =</text><text x="869.52" y="505" font-size="13" font-weight="600" fill="#172331" text-anchor="start">3.90</text><g><rect x="930" y="494" width="10" height="10" rx="2" fill="#00b894"/><text x="946" y="503" font-size="12" font-weight="500" fill="#172331" text-anchor="start">Express and Normal</text></g></g><g><text x="50" y="576" font-size="12.5" font-weight="600" fill="#172331" text-anchor="start">Counter 2</text><rect x="470" y="554" width="84" height="36" rx="6" fill="#172331"/><text x="512" y="577" font-size="11.5" font-weight="600" fill="#ffffff" text-anchor="middle">till</text><circle cx="440" cy="572" r="15" fill="#6a4ce2" stroke="#172331" stroke-width="2.2"/><text x="440" y="576" font-size="11" font-weight="600" fill="#ffffff" text-anchor="middle">30</text><text x="440" y="602" font-size="10" font-weight="400" fill="#556270" text-anchor="middle">2.17 min left</text><g><circle cx="396" cy="572" r="15" fill="#a99af3" stroke="#ffffff" stroke-width="2"/><text x="396" y="576" font-size="11" font-weight="600" fill="#172331" text-anchor="middle">35</text></g><text x="600" y="577" font-size="13" font-weight="600" fill="#172331" text-anchor="start">2</text><text x="720" y="577" font-size="12" font-weight="400" fill="#556270" text-anchor="start">2.167 + 2.917 =</text><text x="819.6" y="577" font-size="13" font-weight="600" fill="#172331" text-anchor="start">5.08</text><g><rect x="930" y="566" width="10" height="10" rx="2" fill="#257de0"/><text x="946" y="575" font-size="12" font-weight="500" fill="#172331" text-anchor="start">Shortest Queue</text></g></g><g><text x="50" y="648" font-size="12.5" font-weight="600" fill="#172331" text-anchor="start">Counter 3</text><rect x="470" y="626" width="84" height="36" rx="6" fill="#172331"/><text x="512" y="649" font-size="11.5" font-weight="600" fill="#ffffff" text-anchor="middle">till</text><circle cx="440" cy="644" r="15" fill="#6a4ce2" stroke="#172331" stroke-width="2.2"/><text x="440" y="648" font-size="11" font-weight="600" fill="#ffffff" text-anchor="middle">12</text><text x="440" y="674" font-size="10" font-weight="400" fill="#556270" text-anchor="middle">0.77 min left</text><g><circle cx="396" cy="644" r="15" fill="#a99af3" stroke="#ffffff" stroke-width="2"/><text x="396" y="648" font-size="11" font-weight="600" fill="#172331" text-anchor="middle">6</text></g><g><circle cx="358" cy="644" r="15" fill="#a99af3" stroke="#ffffff" stroke-width="2"/><text x="358" y="648" font-size="11" font-weight="600" fill="#172331" text-anchor="middle">8</text></g><text x="600" y="649" font-size="13" font-weight="600" fill="#172331" text-anchor="start">3</text><text x="720" y="649" font-size="12" font-weight="400" fill="#556270" text-anchor="start">0.767 + 1.467 + 1.567 =</text><text x="869.52" y="649" font-size="13" font-weight="600" fill="#172331" text-anchor="start">3.80</text><g><rect x="930" y="638" width="10" height="10" rx="2" fill="#f47230"/><text x="946" y="647" font-size="12" font-weight="500" fill="#172331" text-anchor="start">Shortest Est. Wait</text></g></g><g><rect x="265.84" y="705" width="588.32" height="17" rx="3" fill="#ffffff"/><text x="560" y="717" font-size="12" fill="#172331" text-anchor="middle" font-weight="400">Three strategies, three different choices: the fewest people is not always the shortest wait.</text></g></svg>