<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1110 620" width="1110" height="620" role="img" aria-labelledby="worked-example-three-customers-one-counter-t worked-example-three-customers-one-counter-d" font-family="&quot;IBM Plex Sans&quot;, &quot;Segoe UI&quot;, system-ui, -apple-system, sans-serif"><title id="worked-example-three-customers-one-counter-t">Worked example: three customers, one counter</title><desc id="worked-example-three-customers-one-counter-d">A hand-checkable run with three customers and one counter: the event log, a timeline of shopping, waiting and service, the queue length Q(t) with its area, and the measures computed from them.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#5d6b7a"/></marker><marker id="arrow-strong" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#172331"/></marker><marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#257de0"/></marker></defs><rect x="0" y="0" width="1110" height="620" fill="#ffffff"/><text x="30" y="34" font-size="13" font-weight="600" fill="#172331" text-anchor="start">Event log</text><text x="30" y="54" font-size="11" font-weight="400" fill="#556270" text-anchor="start">Walking takes no time here, to keep the table short.</text><line x1="30" x2="540" y1="68" y2="68" stroke="#d5dbe2"/><text x="30" y="86" font-size="11" font-weight="600" fill="#556270" text-anchor="start">t (min)</text><text x="92" y="86" font-size="11" font-weight="600" fill="#556270" text-anchor="start">Event</text><text x="240" y="86" font-size="11" font-weight="600" fill="#556270" text-anchor="start">What happens</text><g><line x1="30" x2="540" y1="96" y2="96" stroke="#eef1f4"/><text x="30" y="114" font-size="12" font-weight="400" fill="#172331" text-anchor="start" font-family="&quot;IBM Plex Mono&quot;, Consolas, ui-monospace, monospace">0.0</text><text x="92" y="114" font-size="12" font-weight="500" fill="#172331" text-anchor="start">C1 arrives</text><text x="240" y="114" font-size="12" font-weight="400" fill="#556270" text-anchor="start">shops for 1.0 min</text></g><g><line x1="30" x2="540" y1="123" y2="123" stroke="#eef1f4"/><text x="30" y="141" font-size="12" font-weight="400" fill="#172331" text-anchor="start" font-family="&quot;IBM Plex Mono&quot;, Consolas, ui-monospace, monospace">1.0</text><text x="92" y="141" font-size="12" font-weight="500" fill="#172331" text-anchor="start">C1 at checkout</text><text x="240" y="141" font-size="12" font-weight="400" fill="#556270" text-anchor="start">counter free: served for 3.0 min</text></g><g><line x1="30" x2="540" y1="150" y2="150" stroke="#eef1f4"/><text x="30" y="168" font-size="12" font-weight="400" fill="#172331" text-anchor="start" font-family="&quot;IBM Plex Mono&quot;, Consolas, ui-monospace, monospace">1.0</text><text x="92" y="168" font-size="12" font-weight="500" fill="#172331" text-anchor="start">C2 arrives</text><text x="240" y="168" font-size="12" font-weight="400" fill="#556270" text-anchor="start">shops for 1.0 min</text></g><g><line x1="30" x2="540" y1="177" y2="177" stroke="#eef1f4"/><text x="30" y="195" font-size="12" font-weight="400" fill="#172331" text-anchor="start" font-family="&quot;IBM Plex Mono&quot;, Consolas, ui-monospace, monospace">2.0</text><text x="92" y="195" font-size="12" font-weight="500" fill="#172331" text-anchor="start">C2 at checkout</text><text x="240" y="195" font-size="12" font-weight="400" fill="#556270" text-anchor="start">counter busy: queue Q = 1</text></g><g><line x1="30" x2="540" y1="204" y2="204" stroke="#eef1f4"/><text x="30" y="222" font-size="12" font-weight="400" fill="#172331" text-anchor="start" font-family="&quot;IBM Plex Mono&quot;, Consolas, ui-monospace, monospace">2.0</text><text x="92" y="222" font-size="12" font-weight="500" fill="#172331" text-anchor="start">C3 arrives</text><text x="240" y="222" font-size="12" font-weight="400" fill="#556270" text-anchor="start">shops for 0.5 min</text></g><g><line x1="30" x2="540" y1="231" y2="231" stroke="#eef1f4"/><text x="30" y="249" font-size="12" font-weight="400" fill="#172331" text-anchor="start" font-family="&quot;IBM Plex Mono&quot;, Consolas, ui-monospace, monospace">2.5</text><text x="92" y="249" font-size="12" font-weight="500" fill="#172331" text-anchor="start">C3 at checkout</text><text x="240" y="249" font-size="12" font-weight="400" fill="#556270" text-anchor="start">queue Q = 2</text></g><g><line x1="30" x2="540" y1="258" y2="258" stroke="#eef1f4"/><text x="30" y="276" font-size="12" font-weight="400" fill="#172331" text-anchor="start" font-family="&quot;IBM Plex Mono&quot;, Consolas, ui-monospace, monospace">4.0</text><text x="92" y="276" font-size="12" font-weight="500" fill="#172331" text-anchor="start">C1 leaves</text><text x="240" y="276" font-size="12" font-weight="400" fill="#556270" text-anchor="start">C2 served for 2.0 min, Q = 1</text></g><g><line x1="30" x2="540" y1="285" y2="285" stroke="#eef1f4"/><text x="30" y="303" font-size="12" font-weight="400" fill="#172331" text-anchor="start" font-family="&quot;IBM Plex Mono&quot;, Consolas, ui-monospace, monospace">6.0</text><text x="92" y="303" font-size="12" font-weight="500" fill="#172331" text-anchor="start">C2 leaves</text><text x="240" y="303" font-size="12" font-weight="400" fill="#556270" text-anchor="start">C3 served for 1.0 min, Q = 0</text></g><g><line x1="30" x2="540" y1="312" y2="312" stroke="#eef1f4"/><text x="30" y="330" font-size="12" font-weight="400" fill="#172331" text-anchor="start" font-family="&quot;IBM Plex Mono&quot;, Consolas, ui-monospace, monospace">7.0</text><text x="92" y="330" font-size="12" font-weight="500" fill="#172331" text-anchor="start">C3 leaves</text><text x="240" y="330" font-size="12" font-weight="400" fill="#556270" text-anchor="start">counter idle</text></g><text x="590" y="34" font-size="13" font-weight="600" fill="#172331" text-anchor="start">Timeline</text><g><line x1="590" x2="590" y1="60" y2="336" stroke="#eef1f4"/><text x="590" y="354" font-size="11" font-weight="400" fill="#556270" text-anchor="middle">0</text></g><g><line x1="652" x2="652" y1="60" y2="336" stroke="#eef1f4"/><text x="652" y="354" font-size="11" font-weight="400" fill="#556270" text-anchor="middle">1</text></g><g><line x1="714" x2="714" y1="60" y2="336" stroke="#eef1f4"/><text x="714" y="354" font-size="11" font-weight="400" fill="#556270" text-anchor="middle">2</text></g><g><line x1="776" x2="776" y1="60" y2="336" stroke="#eef1f4"/><text x="776" y="354" font-size="11" font-weight="400" fill="#556270" text-anchor="middle">3</text></g><g><line x1="838" x2="838" y1="60" y2="336" stroke="#eef1f4"/><text x="838" y="354" font-size="11" font-weight="400" fill="#556270" text-anchor="middle">4</text></g><g><line x1="900" x2="900" y1="60" y2="336" stroke="#eef1f4"/><text x="900" y="354" font-size="11" font-weight="400" fill="#556270" text-anchor="middle">5</text></g><g><line x1="962" x2="962" y1="60" y2="336" stroke="#eef1f4"/><text x="962" y="354" font-size="11" font-weight="400" fill="#556270" text-anchor="middle">6</text></g><g><line x1="1024" x2="1024" y1="60" y2="336" stroke="#eef1f4"/><text x="1024" y="354" font-size="11" font-weight="400" fill="#556270" text-anchor="middle">7</text></g><g><line x1="1086" x2="1086" y1="60" y2="336" stroke="#eef1f4"/><text x="1086" y="354" font-size="11" font-weight="400" fill="#556270" text-anchor="middle">8</text></g><text x="1096" y="354" font-size="11" font-weight="400" fill="#8793a0" text-anchor="start">min</text><g><text x="576" y="86" font-size="12" font-weight="600" fill="#172331" text-anchor="end">C1</text><rect x="590" y="70" width="62" height="22" rx="3" fill="#e4defc"/><rect x="652" y="70" width="186" height="22" rx="3" fill="#257de0"/></g><g><text x="576" y="126" font-size="12" font-weight="600" fill="#172331" text-anchor="end">C2</text><rect x="652" y="110" width="62" height="22" rx="3" fill="#e4defc"/><rect x="714" y="110" width="124" height="22" rx="3" fill="#fbd98a"/><rect x="838" y="110" width="124" height="22" rx="3" fill="#257de0"/><text x="776" y="125" font-size="11" font-weight="400" fill="#172331" text-anchor="middle">waits 2</text></g><g><text x="576" y="166" font-size="12" font-weight="600" fill="#172331" text-anchor="end">C3</text><rect x="714" y="150" width="31" height="22" rx="3" fill="#e4defc"/><rect x="745" y="150" width="217" height="22" rx="3" fill="#fbd98a"/><rect x="962" y="150" width="62" height="22" rx="3" fill="#257de0"/><text x="853.5" y="165" font-size="11" font-weight="400" fill="#172331" text-anchor="middle">waits 3.5</text></g><g><rect x="590" y="196" width="12" height="10" rx="2" fill="#e4defc"/><text x="608" y="205" font-size="11" font-weight="400" fill="#556270" text-anchor="start">shopping</text><rect x="680" y="196" width="12" height="10" rx="2" fill="#fbd98a"/><text x="698" y="205" font-size="11" font-weight="400" fill="#556270" text-anchor="start">waiting</text><rect x="762" y="196" width="12" height="10" rx="2" fill="#257de0"/><text x="780" y="205" font-size="11" font-weight="400" fill="#556270" text-anchor="start">being served</text></g><text x="564" y="314" font-size="12" font-weight="600" fill="#172331" text-anchor="end">Q(t)</text><path d="M590,336H714V310H745V284H838V310H962V336H1086V336V336Z" fill="#257de0" fill-opacity="0.14"/><path d="M590,336H714V310H745V284H838V310H962V336H1086V336" fill="none" stroke="#257de0" stroke-width="2"/><line x1="590" x2="1086" y1="336" y2="336" stroke="#c2c8cf"/><text x="584" y="314" font-size="10.5" font-weight="400" fill="#556270" text-anchor="end">1</text><text x="584" y="288" font-size="10.5" font-weight="400" fill="#556270" text-anchor="end">2</text><g><rect x="667.14" y="258.4" width="242.52" height="16" rx="3" fill="#ffffff"/><text x="788.4" y="269.4" font-size="11" fill="#172331" text-anchor="middle" font-weight="400">area = 0.5 + 3.0 + 2.0 = 5.5 customer-min</text></g><text x="576" y="240" font-size="12" font-weight="600" fill="#172331" text-anchor="end">B(t)</text><rect x="652" y="228" width="372" height="16" rx="3" fill="#172331"/><text x="838" y="240" font-size="10.5" font-weight="400" fill="#ffffff" text-anchor="middle">cashier busy from 1 to 7: 6 min</text><rect x="30" y="400" width="1050" height="190" rx="10" fill="#f6f8fa" stroke="#e2e6eb"/><text x="50" y="428" font-size="13" font-weight="600" fill="#172331" text-anchor="start">Measures for a run length of T = 20 min</text><g><text x="50" y="458" font-size="12" font-weight="400" fill="#556270" text-anchor="start">Average wait</text><text x="230" y="458" font-size="12.5" font-weight="600" fill="#172331" text-anchor="start">(0 + 2 + 3.5) / 3 = 1.83 min</text></g><g><text x="570" y="458" font-size="12" font-weight="400" fill="#556270" text-anchor="start">Longest wait</text><text x="750" y="458" font-size="12.5" font-weight="600" fill="#172331" text-anchor="start">3.5 min (C3)</text></g><g><text x="50" y="490" font-size="12" font-weight="400" fill="#556270" text-anchor="start">Average queue length</text><text x="230" y="490" font-size="12.5" font-weight="600" fill="#172331" text-anchor="start">5.5 / 20 = 0.275 customers</text></g><g><text x="570" y="490" font-size="12" font-weight="400" fill="#556270" text-anchor="start">Longest queue</text><text x="750" y="490" font-size="12.5" font-weight="600" fill="#172331" text-anchor="start">2 customers, from 2.5 to 4.0</text></g><g><text x="50" y="522" font-size="12" font-weight="400" fill="#556270" text-anchor="start">Utilisation</text><text x="230" y="522" font-size="12.5" font-weight="600" fill="#172331" text-anchor="start">6 / 20 = 30%</text></g><g><text x="570" y="522" font-size="12" font-weight="400" fill="#556270" text-anchor="start">Average time in store</text><text x="750" y="522" font-size="12.5" font-weight="600" fill="#172331" text-anchor="start">(4 + 5 + 5) / 3 = 4.67 min</text></g><g><text x="50" y="554" font-size="12" font-weight="400" fill="#556270" text-anchor="start">Little's law</text><text x="230" y="554" font-size="12.5" font-weight="600" fill="#172331" text-anchor="start">arrival rate x wait = (3 / 20) x 1.83 = 0.275</text></g><g><text x="570" y="554" font-size="12" font-weight="400" fill="#556270" text-anchor="start">Unit test</text><text x="750" y="554" font-size="12.5" font-weight="600" fill="#172331" text-anchor="start" font-family="&quot;IBM Plex Mono&quot;, Consolas, ui-monospace, monospace">TestHandWorkedExample</text></g></svg>