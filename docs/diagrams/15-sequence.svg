<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 640" width="1100" height="640" role="img" aria-labelledby="what-happens-when-you-press-start-t what-happens-when-you-press-start-d" font-family="&quot;IBM Plex Sans&quot;, &quot;Segoe UI&quot;, system-ui, -apple-system, sans-serif"><title id="what-happens-when-you-press-start-t">What happens when you press Start</title><desc id="what-happens-when-you-press-start-d">Sequence of messages between the user, the React app, the Django API, the simulation engine and SQLite during one simulation run.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#5d6b7a"/></marker><marker id="arrow-strong" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#172331"/></marker><marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#257de0"/></marker></defs><rect x="0" y="0" width="1100" height="640" fill="#ffffff"/><g><rect x="0" y="24" width="160" height="40" rx="8" fill="#ffffff" stroke="#172331" stroke-width="1.3"/><text x="80" y="49" font-size="13" font-weight="600" fill="#172331" text-anchor="middle">User</text><line x1="80" x2="80" y1="64" y2="604" stroke="#8793a0" stroke-dasharray="4 4"/></g><g><rect x="210" y="24" width="160" height="40" rx="8" fill="#ffffff" stroke="#172331" stroke-width="1.3"/><text x="290" y="49" font-size="13" font-weight="600" fill="#172331" text-anchor="middle">React app</text><line x1="290" x2="290" y1="64" y2="604" stroke="#8793a0" stroke-dasharray="4 4"/></g><g><rect x="440" y="24" width="160" height="40" rx="8" fill="#ffffff" stroke="#172331" stroke-width="1.3"/><text x="520" y="49" font-size="13" font-weight="600" fill="#172331" text-anchor="middle">Django API</text><line x1="520" x2="520" y1="64" y2="604" stroke="#8793a0" stroke-dasharray="4 4"/></g><g><rect x="680" y="24" width="160" height="40" rx="8" fill="#172331" stroke="#172331" stroke-width="1.3"/><text x="760" y="49" font-size="13" font-weight="600" fill="#ffffff" text-anchor="middle">Simulation engine</text><line x1="760" x2="760" y1="64" y2="604" stroke="#8793a0" stroke-dasharray="4 4"/></g><g><rect x="910" y="24" width="160" height="40" rx="8" fill="#ffffff" stroke="#172331" stroke-width="1.3"/><text x="990" y="49" font-size="13" font-weight="600" fill="#172331" text-anchor="middle">SQLite</text><line x1="990" x2="990" y1="64" y2="604" stroke="#8793a0" stroke-dasharray="4 4"/></g><g><g><circle cx="60" cy="100" r="10" fill="#172331" stroke="#172331" stroke-width="1.2"/><text x="60" y="104" font-size="11" font-weight="600" fill="#ffffff" text-anchor="middle">1</text></g><g><path d="M80,100 L288,100" fill="none" stroke="#172331" stroke-width="1.8" marker-end="url(#arrow-strong)" stroke-linejoin="round"/></g><g><rect x="90" y="82" width="99.52000000000001" height="16" rx="3" fill="#ffffff"/><text x="94" y="93" font-size="11" fill="#172331" text-anchor="start" font-weight="400">Start simulation</text></g></g><g><g><circle cx="270" cy="142" r="10" fill="#172331" stroke="#172331" stroke-width="1.2"/><text x="270" y="146" font-size="11" font-weight="600" fill="#ffffff" text-anchor="middle">2</text></g><g><path d="M290,142 L518,142" fill="none" stroke="#172331" stroke-width="1.8" marker-end="url(#arrow-strong)" stroke-linejoin="round"/></g><g><rect x="300" y="124" width="252.2" height="16" rx="3" fill="#ffffff"/><text x="304" y="135" font-size="11" fill="#172331" text-anchor="start" font-weight="400" font-family="&quot;IBM Plex Mono&quot;, Consolas, ui-monospace, monospace">POST /api/runs {strategy, parameters}</text></g></g><g><g><circle cx="498" cy="184" r="10" fill="#ffffff" stroke="#172331" stroke-width="1.2"/><text x="498" y="188" font-size="11" font-weight="600" fill="#172331" text-anchor="middle">3</text></g><path d="M520,178 h44 v18 h-40" fill="none" stroke="#5d6b7a" stroke-width="1.4" marker-end="url(#arrow)"/><g><rect x="568" y="178" width="245.6" height="16" rx="3" fill="#ffffff"/><text x="572" y="189" font-size="11" fill="#556270" text-anchor="start" font-weight="400" font-family="&quot;IBM Plex Mono&quot;, Consolas, ui-monospace, monospace">validate: SimulationConfig.from_dict</text></g></g><g><g><circle cx="500" cy="226" r="10" fill="#172331" stroke="#172331" stroke-width="1.2"/><text x="500" y="230" font-size="11" font-weight="600" fill="#ffffff" text-anchor="middle">4</text></g><g><path d="M520,226 L758,226" fill="none" stroke="#172331" stroke-width="1.8" marker-end="url(#arrow-strong)" stroke-linejoin="round"/></g><g><rect x="530" y="208" width="219.2" height="16" rx="3" fill="#ffffff"/><text x="534" y="219" font-size="11" fill="#172331" text-anchor="start" font-weight="400" font-family="&quot;IBM Plex Mono&quot;, Consolas, ui-monospace, monospace">run_simulation(config, strategy)</text></g></g><g><g><circle cx="738" cy="268" r="10" fill="#ffffff" stroke="#172331" stroke-width="1.2"/><text x="738" y="272" font-size="11" font-weight="600" fill="#172331" text-anchor="middle">5</text></g><path d="M760,262 h44 v18 h-40" fill="none" stroke="#5d6b7a" stroke-width="1.4" marker-end="url(#arrow)"/><g><rect x="808" y="262" width="231.08" height="16" rx="3" fill="#ffffff"/><text x="812" y="273" font-size="11" fill="#556270" text-anchor="start" font-weight="400">generate customers, process events to T</text></g></g><g><g><circle cx="780" cy="310" r="10" fill="#ffffff" stroke="#172331" stroke-width="1.2"/><text x="780" y="314" font-size="11" font-weight="600" fill="#172331" text-anchor="middle">6</text></g><g><path d="M760,310 L522,310" fill="none" stroke="#5d6b7a" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#arrow)" stroke-linejoin="round"/></g><g><rect x="530" y="292" width="99.52000000000001" height="16" rx="3" fill="#ffffff"/><text x="534" y="303" font-size="11" fill="#172331" text-anchor="start" font-weight="400">SimulationResult</text></g></g><g><g><circle cx="500" cy="352" r="10" fill="#172331" stroke="#172331" stroke-width="1.2"/><text x="500" y="356" font-size="11" font-weight="600" fill="#ffffff" text-anchor="middle">7</text></g><g><path d="M520,352 L758,352" fill="none" stroke="#172331" stroke-width="1.8" marker-end="url(#arrow-strong)" stroke-linejoin="round"/></g><g><rect x="530" y="334" width="278.59999999999997" height="16" rx="3" fill="#ffffff"/><text x="534" y="345" font-size="11" fill="#172331" text-anchor="start" font-weight="400" font-family="&quot;IBM Plex Mono&quot;, Consolas, ui-monospace, monospace">compute_metrics, time_series, build_trace</text></g></g><g><g><circle cx="780" cy="394" r="10" fill="#ffffff" stroke="#172331" stroke-width="1.2"/><text x="780" y="398" font-size="11" font-weight="600" fill="#172331" text-anchor="middle">8</text></g><g><path d="M760,394 L522,394" fill="none" stroke="#5d6b7a" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#arrow)" stroke-linejoin="round"/></g><g><rect x="530" y="376" width="139.56" height="16" rx="3" fill="#ffffff"/><text x="534" y="387" font-size="11" fill="#172331" text-anchor="start" font-weight="400">measures, series, trace</text></g></g><g><g><circle cx="500" cy="436" r="10" fill="#172331" stroke="#172331" stroke-width="1.2"/><text x="500" y="440" font-size="11" font-weight="600" fill="#ffffff" text-anchor="middle">9</text></g><g><path d="M520,436 L988,436" fill="none" stroke="#172331" stroke-width="1.8" marker-end="url(#arrow-strong)" stroke-linejoin="round"/></g><g><rect x="530" y="418" width="110.96000000000001" height="16" rx="3" fill="#ffffff"/><text x="534" y="429" font-size="11" fill="#172331" text-anchor="start" font-weight="400">save SimulationRun</text></g></g><g><g><circle cx="540" cy="478" r="10" fill="#ffffff" stroke="#172331" stroke-width="1.2"/><text x="540" y="482" font-size="11" font-weight="600" fill="#172331" text-anchor="middle">10</text></g><g><path d="M520,478 L292,478" fill="none" stroke="#5d6b7a" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#arrow)" stroke-linejoin="round"/></g><g><rect x="300" y="460" width="105.24000000000001" height="16" rx="3" fill="#ffffff"/><text x="304" y="471" font-size="11" fill="#172331" text-anchor="start" font-weight="400">201 Created: JSON</text></g></g><g><g><circle cx="268" cy="520" r="10" fill="#ffffff" stroke="#172331" stroke-width="1.2"/><text x="268" y="524" font-size="11" font-weight="600" fill="#172331" text-anchor="middle">11</text></g><path d="M290,514 h44 v18 h-40" fill="none" stroke="#5d6b7a" stroke-width="1.4" marker-end="url(#arrow)"/><g><rect x="338" y="514" width="173.88" height="16" rx="3" fill="#ffffff"/><text x="342" y="525" font-size="11" fill="#556270" text-anchor="start" font-weight="400">replay the trace, draw charts</text></g></g><g><g><circle cx="310" cy="562" r="10" fill="#ffffff" stroke="#172331" stroke-width="1.2"/><text x="310" y="566" font-size="11" font-weight="600" fill="#172331" text-anchor="middle">12</text></g><g><path d="M290,562 L82,562" fill="none" stroke="#5d6b7a" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#arrow)" stroke-linejoin="round"/></g><g><rect x="90" y="544" width="162.44" height="16" rx="3" fill="#ffffff"/><text x="94" y="555" font-size="11" fill="#172331" text-anchor="start" font-weight="400">animation, measures, charts</text></g></g><text x="30" y="620" font-size="11" font-weight="400" fill="#556270" text-anchor="start">Solid arrows are requests or calls; dashed arrows are replies. The whole day is simulated in step 5, before any animation starts.</text></svg>