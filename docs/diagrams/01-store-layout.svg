<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 660" width="1140" height="660" role="img" aria-labelledby="store-layout-and-customer-route-t store-layout-and-customer-route-d" font-family="&quot;IBM Plex Sans&quot;, &quot;Segoe UI&quot;, system-ui, -apple-system, sans-serif"><title id="store-layout-and-customer-route-t">Store layout and customer route</title><desc id="store-layout-and-customer-route-d">Floor plan of the simulated supermarket with the route a customer takes from the entrance through the four sections to a checkout counter and the exit.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#5d6b7a"/></marker><marker id="arrow-strong" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#172331"/></marker><marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#257de0"/></marker></defs><rect x="0" y="0" width="1140" height="660" fill="#ffffff"/><line x1="40" x2="840" y1="42" y2="42" stroke="#8793a0"/><line x1="40" x2="40" y1="36" y2="48" stroke="#8793a0"/><line x1="840" x2="840" y1="36" y2="48" stroke="#8793a0"/><g><rect x="424.56" y="36" width="30.880000000000003" height="16" rx="3" fill="#ffffff"/><text x="440" y="47" font-size="11" fill="#556270" text-anchor="middle" font-weight="400">40 m</text></g><line x1="18" x2="18" y1="64" y2="564" stroke="#8793a0"/><line x1="12" x2="24" y1="64" y2="64" stroke="#8793a0"/><line x1="12" x2="24" y1="564" y2="564" stroke="#8793a0"/><g transform="translate(13,314) rotate(-90)"><g><rect x="-15.440000000000001" y="-10" width="30.880000000000003" height="16" rx="3" fill="#ffffff"/><text x="0" y="1" font-size="11" fill="#556270" text-anchor="middle" font-weight="400">25 m</text></g></g><rect x="40" y="64" width="800" height="500" fill="#ffffff"/><g><rect x="80" y="104" width="170" height="140" fill="#f6f8fa" stroke="#d5dbe2"/><rect x="96" y="157.33333333333334" width="138" height="14" fill="#dfe4ea"/><rect x="96" y="200.66666666666669" width="138" height="14" fill="#dfe4ea"/><text x="92" y="120" font-size="12" font-weight="600" fill="#172331" text-anchor="start">Grocery</text></g><g><rect x="270" y="104" width="160" height="140" fill="#f6f8fa" stroke="#d5dbe2"/><rect x="286" y="157.33333333333334" width="128" height="14" fill="#dfe4ea"/><rect x="286" y="200.66666666666669" width="128" height="14" fill="#dfe4ea"/><text x="282" y="120" font-size="12" font-weight="600" fill="#172331" text-anchor="start">Beverages</text></g><g><rect x="450" y="104" width="160" height="140" fill="#f6f8fa" stroke="#d5dbe2"/><rect x="466" y="157.33333333333334" width="128" height="14" fill="#dfe4ea"/><rect x="466" y="200.66666666666669" width="128" height="14" fill="#dfe4ea"/><text x="462" y="120" font-size="12" font-weight="600" fill="#172331" text-anchor="start">Household</text></g><g><rect x="630" y="104" width="170" height="140" fill="#f6f8fa" stroke="#d5dbe2"/><rect x="646" y="157.33333333333334" width="138" height="14" fill="#dfe4ea"/><rect x="646" y="200.66666666666669" width="138" height="14" fill="#dfe4ea"/><text x="642" y="120" font-size="12" font-weight="600" fill="#172331" text-anchor="start">Personal Care</text></g><g><line x1="169" x2="169" y1="326" y2="496" stroke="#d3d9e0"/><line x1="191" x2="191" y1="326" y2="496" stroke="#d3d9e0"/><rect x="194" y="428" width="21" height="68.00000000000004" fill="#e9edf2" stroke="#c9d0d8"/><rect x="196.4" y="479" width="16.200000000000003" height="14" fill="#2d3d50"/><rect x="192.1" y="409" width="25" height="16" rx="3" fill="#ffffff" stroke="#aab3bd"/><text x="204.5" y="421" font-size="11" font-weight="600" fill="#556270" text-anchor="middle">1</text><text x="187" y="516" font-size="10.5" font-weight="400" fill="#556270" text-anchor="middle">Express</text></g><g><line x1="342.3333333333333" x2="342.3333333333333" y1="326" y2="496" stroke="#d3d9e0"/><line x1="364.3333333333333" x2="364.3333333333333" y1="326" y2="496" stroke="#d3d9e0"/><rect x="367.33333333333337" y="428" width="21" height="68.00000000000004" fill="#e9edf2" stroke="#c9d0d8"/><rect x="369.73333333333335" y="479" width="16.200000000000003" height="14" fill="#2d3d50"/><rect x="365.4333333333333" y="409" width="25" height="16" rx="3" fill="#ffffff" stroke="#aab3bd"/><text x="377.8333333333333" y="421" font-size="11" font-weight="600" fill="#556270" text-anchor="middle">2</text></g><g><line x1="515.6666666666666" x2="515.6666666666666" y1="326" y2="496" stroke="#d3d9e0"/><line x1="537.6666666666666" x2="537.6666666666666" y1="326" y2="496" stroke="#d3d9e0"/><rect x="540.6666666666666" y="428" width="21" height="68.00000000000004" fill="#e9edf2" stroke="#c9d0d8"/><rect x="543.0666666666666" y="479" width="16.200000000000003" height="14" fill="#2d3d50"/><rect x="538.7666666666667" y="409" width="25" height="16" rx="3" fill="#ffffff" stroke="#aab3bd"/><text x="551.1666666666666" y="421" font-size="11" font-weight="600" fill="#556270" text-anchor="middle">3</text></g><g><line x1="689" x2="689" y1="326" y2="496" stroke="#d3d9e0"/><line x1="711" x2="711" y1="326" y2="496" stroke="#d3d9e0"/><rect x="714" y="428" width="21" height="68.00000000000004" fill="#e9edf2" stroke="#c9d0d8"/><rect x="716.4" y="479" width="16.200000000000003" height="14" fill="#2d3d50"/><rect x="712.1000000000001" y="409" width="25" height="16" rx="3" fill="#ffffff" stroke="#aab3bd"/><text x="724.5" y="421" font-size="11" font-weight="600" fill="#556270" text-anchor="middle">4</text></g><path d="M68,564H40V64H840V564H812M748,564H132" fill="none" stroke="#2d3d50" stroke-width="3.2"/><text x="100" y="582" font-size="11.5" font-weight="400" fill="#556270" text-anchor="middle">Entrance</text><text x="780" y="582" font-size="11.5" font-weight="400" fill="#556270" text-anchor="middle">Exit</text><path d="M440,305l9,9l-9,9l-9,-9z" fill="#fff7e0" stroke="#e0b43c" stroke-width="1.3"/><g><path d="M100,534 L165,186 L350,186 L530,186 L715,186 L440,314" fill="none" stroke="#257de0" stroke-width="1.8" marker-end="url(#arrow-accent)" stroke-linejoin="round"/></g><g><path d="M440,314 L353.3333333333333,354 L353.3333333333333,446" fill="none" stroke="#257de0" stroke-width="1.8" marker-end="url(#arrow-accent)" stroke-linejoin="round"/></g><g><path d="M353.3333333333333,464 L780,464 L780,534" fill="none" stroke="#257de0" stroke-width="1.8" marker-end="url(#arrow-accent)" stroke-linejoin="round"/></g><circle cx="165" cy="186" r="4" fill="#257de0" stroke="#ffffff" stroke-width="2"/><circle cx="350" cy="186" r="4" fill="#257de0" stroke="#ffffff" stroke-width="2"/><circle cx="530" cy="186" r="4" fill="#257de0" stroke="#ffffff" stroke-width="2"/><circle cx="715" cy="186" r="4" fill="#257de0" stroke="#ffffff" stroke-width="2"/><circle cx="440" cy="314" r="4" fill="#257de0" stroke="#ffffff" stroke-width="2"/><circle cx="353.3333333333333" cy="446" r="4" fill="#257de0" stroke="#ffffff" stroke-width="2"/><circle cx="353.3333333333333" cy="464" r="4" fill="#257de0" stroke="#ffffff" stroke-width="2"/><g><circle cx="122" cy="516" r="10" fill="#172331" stroke="#172331" stroke-width="1.2"/><text x="122" y="520" font-size="11" font-weight="600" fill="#ffffff" text-anchor="middle">1</text></g><g><circle cx="147" cy="208" r="10" fill="#172331" stroke="#172331" stroke-width="1.2"/><text x="147" y="212" font-size="11" font-weight="600" fill="#ffffff" text-anchor="middle">2</text></g><g><circle cx="350" cy="164" r="10" fill="#172331" stroke="#172331" stroke-width="1.2"/><text x="350" y="168" font-size="11" font-weight="600" fill="#ffffff" text-anchor="middle">3</text></g><g><circle cx="735" cy="210" r="10" fill="#172331" stroke="#172331" stroke-width="1.2"/><text x="735" y="214" font-size="11" font-weight="600" fill="#ffffff" text-anchor="middle">4</text></g><g><circle cx="464" cy="298" r="10" fill="#172331" stroke="#172331" stroke-width="1.2"/><text x="464" y="302" font-size="11" font-weight="600" fill="#ffffff" text-anchor="middle">5</text></g><g><circle cx="327.3333333333333" cy="446" r="10" fill="#172331" stroke="#172331" stroke-width="1.2"/><text x="327.3333333333333" y="450" font-size="11" font-weight="600" fill="#ffffff" text-anchor="middle">6</text></g><g><circle cx="756" cy="504" r="10" fill="#172331" stroke="#172331" stroke-width="1.2"/><text x="756" y="508" font-size="11" font-weight="600" fill="#ffffff" text-anchor="middle">7</text></g><text x="890" y="80" font-size="13.5" font-weight="600" fill="#172331" text-anchor="start">One customer's journey</text><g><g><circle cx="900" cy="112" r="10" fill="#172331" stroke="#172331" stroke-width="1.2"/><text x="900" y="116" font-size="11" font-weight="600" fill="#ffffff" text-anchor="middle">1</text></g><text x="918" y="116" font-size="12.5" font-weight="600" fill="#172331" text-anchor="start">Enter</text><text x="918" y="134" font-size="11.5" fill="#556270" font-weight="400" text-anchor="start"><tspan x="918" dy="0">Customers arrive at random through</tspan><tspan x="918" dy="15">the entrance.</tspan></text></g><g><g><circle cx="900" cy="168" r="10" fill="#172331" stroke="#172331" stroke-width="1.2"/><text x="900" y="172" font-size="11" font-weight="600" fill="#ffffff" text-anchor="middle">2</text></g><text x="918" y="172" font-size="12.5" font-weight="600" fill="#172331" text-anchor="start">Walk to the first section</text><text x="918" y="190" font-size="11.5" fill="#556270" font-weight="400" text-anchor="start"><tspan x="918" dy="0">Walking time = distance / walking</tspan><tspan x="918" dy="15">speed.</tspan></text></g><g><g><circle cx="900" cy="224" r="10" fill="#172331" stroke="#172331" stroke-width="1.2"/><text x="900" y="228" font-size="11" font-weight="600" fill="#ffffff" text-anchor="middle">3</text></g><text x="918" y="228" font-size="12.5" font-weight="600" fill="#172331" text-anchor="start">Shop</text><text x="918" y="246" font-size="11.5" fill="#556270" font-weight="400" text-anchor="start"><tspan x="918" dy="0">Pick items in each section on the</tspan><tspan x="918" dy="15">route, in store order.</tspan></text></g><g><g><circle cx="900" cy="280" r="10" fill="#172331" stroke="#172331" stroke-width="1.2"/><text x="900" y="284" font-size="11" font-weight="600" fill="#ffffff" text-anchor="middle">4</text></g><text x="918" y="284" font-size="12.5" font-weight="600" fill="#172331" text-anchor="start">Walk to the checkouts</text><text x="918" y="302" font-size="11.5" fill="#556270" font-weight="400" text-anchor="start"><tspan x="918" dy="0">Only sections with items in the</tspan><tspan x="918" dy="15">basket are visited.</tspan></text></g><g><g><circle cx="900" cy="336" r="10" fill="#172331" stroke="#172331" stroke-width="1.2"/><text x="900" y="340" font-size="11" font-weight="600" fill="#ffffff" text-anchor="middle">5</text></g><text x="918" y="340" font-size="12.5" font-weight="600" fill="#172331" text-anchor="start">Choose a counter</text><text x="918" y="358" font-size="11.5" fill="#556270" font-weight="400" text-anchor="start"><tspan x="918" dy="0">The checkout strategy picks one</tspan><tspan x="918" dy="15">counter here.</tspan></text></g><g><g><circle cx="900" cy="392" r="10" fill="#172331" stroke="#172331" stroke-width="1.2"/><text x="900" y="396" font-size="11" font-weight="600" fill="#ffffff" text-anchor="middle">6</text></g><text x="918" y="396" font-size="12.5" font-weight="600" fill="#172331" text-anchor="start">Queue</text><text x="918" y="414" font-size="11.5" fill="#556270" font-weight="400" text-anchor="start"><tspan x="918" dy="0">Each counter has its own first-in,</tspan><tspan x="918" dy="15">first-out queue.</tspan></text></g><g><g><circle cx="900" cy="448" r="10" fill="#172331" stroke="#172331" stroke-width="1.2"/><text x="900" y="452" font-size="11" font-weight="600" fill="#ffffff" text-anchor="middle">7</text></g><text x="918" y="452" font-size="12.5" font-weight="600" fill="#172331" text-anchor="start">Pay and leave</text><text x="918" y="470" font-size="11.5" fill="#556270" font-weight="400" text-anchor="start"><tspan x="918" dy="0">Service = scan every item + pay,</tspan><tspan x="918" dy="15">then exit.</tspan></text></g><rect x="884" y="512" width="236" height="66" rx="8" fill="#f6f8fa" stroke="#e2e6eb"/><text x="898" y="536" font-size="11.5" fill="#556270" font-weight="400" text-anchor="start"><tspan x="898" dy="0">Sections have unlimited room, so</tspan><tspan x="898" dy="15">nobody queues to shop. The only</tspan><tspan x="898" dy="15">queues are at the counters.</tspan></text></svg>