w-accent)" stroke-linejoin="round"/></g><g><circle cx="171.3" cy="186" r="8" fill="#257de0" stroke="#ffffff" stroke-width="2"/><text x="171.3" y="189.8" font-size="10" font-weight="600" fill="#ffffff" text-anchor="middle">1</text></g><g><circle cx="512.6" cy="142.66666666666669" r="8" fill="#257de0" stroke="#ffffff" stroke-width="2"/><text x="512.6" y="146.4666666666667" font-size="10" font-weight="600" fill="#ffffff" text-anchor="middle">2</text></g><g><circle cx="727.6" cy="229.33333333333331" r="8" fill="#257de0" stroke="#ffffff" stroke-width="2"/><text x="727.6" y="233.13333333333333" font-size="10" font-weight="600" fill="#ffffff" text-anchor="middle">3</text></g><circle cx="353.3333333333333" cy="464" r="4" fill="#257de0" stroke="#ffffff" stroke-width="2"/><g><circle cx="124" cy="522" r="10" fill="#172331" stroke="#172331" stroke-width="1.2"/><text x="124" y="526" font-size="11" font-weight="600" fill="#ffffff" text-anchor="middle">1</text></g><g><circle cx="122" cy="404" r="10" fill="#172331" stroke="#172331" stroke-width="1.2"/><text x="122" y="408" font-size="11" font-weight="600" fill="#ffffff" text-anchor="middle">2</text></g><g><circle cx="173.3" cy="212" r="10" fill="#172331" stroke="#172331" stroke-width="1.2"/><text x="173.3" y="216" font-size="11" font-weight="600" fill="#ffffff" text-anchor="middle">3</text></g><g><circle cx="589.8000000000001" cy="293.66666666666663" r="10" fill="#172331" stroke="#172331" stroke-width="1.2"/><text x="589.8000000000001" y="297.66666666666663" font-size="11" font-weight="600" fill="#ffffff" text-anchor="middle">4</text></g><g><circle cx="464" cy="320" r="10" fill="#172331" stroke="#172331" stroke-width="1.2"/><text x="464" y="324" font-size="11" font-weight="600" fill="#ffffff" text-anchor="middle">5</text></g><g><circle cx="327.3333333333333" cy="404" r="10" fill="#172331" stroke="#172331" stroke-width="1.2"/><text x="327.3333333333333" y="408" font-size="11" font-weight="600" fill="#ffffff" text-anchor="middle">6</text></g><g><circle cx="754" cy="514" r="10" fill="#172331" stroke="#172331" stroke-width="1.2"/><text x="754" y="518" font-size="11" font-weight="600" fill="#ffffff" text-anchor="middle">7</text></g><text x="890" y="80" font-size="13.5" font-weight="600" fill="#172331" text-anchor="start">One customer's journey</text><g><g><circle cx="900" cy="112" r="10" fill="#172331" stroke="#172331" stroke-width="1.2"/><text x="900" y="116" font-size="11" font-weight="600" fill="#ffffff" text-anchor="middle">1</text></g><text x="918" y="116" font-size="12.5" font-weight="600" fill="#172331" text-anchor="start">Enter</text><text x="918" y="134" font-size="11.5" fill="#556270" font-weight="400" text-anchor="start"><tspan x="918" dy="0">Customers arrive at random through</tspan><tspan x="918" dy="15">the entrance.</tspan></text></g><g><g><circle cx="900" cy="172" r="10" fill="#172331" stroke="#172331" stroke-width="1.2"/><text x="900" y="176" font-size="11" font-weight="600" fill="#ffffff" text-anchor="middle">2</text></g><text x="918" y="176" font-size="12.5" font-weight="600" fill="#172331" text-anchor="start">Walk along the walkways</text><text x="918" y="194" font-size="11.5" fill="#556270" font-weight="400" text-anchor="start"><tspan x="918" dy="0">Shortest path on the walkways.</tspan><tspan x="918" dy="15">Time = route length / speed.</tspan></text></g><g><g><circle cx="900" cy="232" r="10" fill="#172331" stroke="#172331" stroke-width="1.2"/><text x="900" y="236" font-size="11" font-weight="600" fill="#ffffff" text-anchor="middle">3</text></g><text x="918" y="236" font-size="12.5" font-weight="600" fill="#172331" text-anchor="start">Shop</text><text x="918" y="254" font-size="11.5" fill="#556270" font-weight="400" text-anchor="start"><tspan x="918" dy="0">Pick items at one spot in each</tspan><tspan x="918" dy="15">section on the route.</tspan></text></g><g><g><circle cx="900" cy="292" r="10" fill="#172331" stroke="#172331" stroke-width="1.2"/><text x="900" y="296" font-size="11" font-weight="600" fill="#ffffff" text-anchor="middle">4</text></g><text x="918" y="296" font-size="12.5" font-weight="600" fill="#172331" text-anchor="start">Walk to the checkouts</text><text x="918" y="314" font-size="11.5" fill="#556270" font-weight="400" text-anchor="start"><tspan x="918" dy="0">Only sections with items in the</tspan><tspan x="918" dy="15">basket are visited.</tspan></text></g><g><g><circle cx="900" cy="352" r="10" fill="#172331" stroke="#172331" stroke-width="1.2"/><text x="900" y="356" font-size="11" font-weight="600" fill="#ffffff" text-anchor="middle">5</text></g><text x="918" y="356" font-size="12.5" font-weight="600" fill="#172331" text-anchor="start">Choose a counter</text><text x="918" y="374" font-size="11.5" fill="#556270" font-weight="400" text-anchor="start"><tspan x="918" dy="0">The checkout strategy picks one</tspan><tspan x="918" dy="15">counter here.</tspan></text></g><g><g><circle cx="900" cy="412" r="10" fill="#172331" stroke="#172331" stroke-width="1.2"/><text x="900" y="416" font-size="11" font-weight="600" fill="#ffffff" text-anchor="middle">6</text></g><text x="918" y="416" font-size="12.5" font-weight="600" fill="#172331" text-anchor="start">Queue</text><text x="918" y="434" font-size="11.5" fill="#556270" font-weight="400" text-anchor="start"><tspan x="918" dy="0">Each counter has its own first-in,</tspan><tspan x="918" dy="15">first-out queue.</tspan></text></g><g><g><circle cx="900" cy="472" r="10" fill="#172331" stroke="#172331" stroke-width="1.2"/><text x="900" y="476" font-size="11" font-weight="600" fill="#ffffff" text-anchor="middle">7</text></g><text x="918" y="476" font-size="12.5" font-weight="600" fill="#172331" text-anchor="start">Pay and leave</text><text x="918" y="494" font-size="11.5" fill="#556270" font-weight="400" text-anchor="start"><tspan x="918" dy="0">Service = scan every item + pay,</tspan><tspan x="918" dy="15">then walk out.</tspan></text></g><g><line x1="886" x2="912" y1="548" y2="548" stroke="#b9c4d1" stroke-width="1.4" stroke-dasharray="2 4"/><text x="920" y="552" font-size="11.5" fill="#556270" font-weight="400" text-anchor="start"><tspan x="920" dy="0">Walkways. Shelving blocks the</tspan><tspan x="920" dy="15">way, so customers change aisle</tspan><tspan x="920" dy="15">only at a cross-aisle.</tspan></text><line x1="886" x2="912" y1="600" y2="600" stroke="#257de0" stroke-width="1.8"/><text x="920" y="604" font-size="11.5" fill="#556270" font-weight="400" text-anchor="start"><tspan x="920" dy="0">Route from the engine. Dashed:</tspan><tspan x="920" dy="15">the walk out, drawn only.</tspan></text><circle cx="899" cy="646" r="8" fill="#257de0"/><text x="899" y="649.8" font-size="10" font-weight="600" fill="#ffffff" text-anchor="middle">1</text><text x="920" y="650" font-size="11.5" fill="#556270" font-weight="400" text-anchor="start"><tspan x="920" dy="0">Shopping spots, in the order</tspan><tspan x="920" dy="15">visited.</tspan></text></g></svg>