<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 600" width="1100" height="600" role="img" aria-labelledby="event-graph-t event-graph-d" font-family="&quot;IBM Plex Sans&quot;, &quot;Segoe UI&quot;, system-ui, -apple-system, sans-serif"><title id="event-graph-t">Event graph</title><desc id="event-graph-d">The five event types, the delay between an event and the events it schedules, the condition on each arrow, and the state changes each event makes.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#5d6b7a"/></marker><marker id="arrow-strong" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#172331"/></marker><marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#257de0"/></marker></defs><rect x="0" y="0" width="1100" height="600" fill="#ffffff"/><g><rect x="40" y="110" width="150" height="38" rx="19" fill="#172331" stroke="#172331" stroke-width="1.3"/><text x="115" y="133.16666666666666" font-size="12.5" font-weight="600" fill="#ffffff" text-anchor="middle" font-family="&quot;IBM Plex Mono&quot;, Consolas, ui-monospace, monospace">ARRIVAL</text></g><g><rect x="300" y="110" width="200" height="38" rx="19" fill="#172331" stroke="#172331" stroke-width="1.3"/><text x="400" y="133.16666666666666" font-size="12.5" font-weight="600" fill="#ffffff" text-anchor="middle" font-family="&quot;IBM Plex Mono&quot;, Consolas, ui-monospace, monospace">SECTION_ARRIVE</text></g><g><rect x="640" y="110" width="200" height="38" rx="19" fill="#172331" stroke="#172331" stroke-width="1.3"/><text x="740" y="133.16666666666666" font-size="12.5" font-weight="600" fill="#ffffff" text-anchor="middle" font-family="&quot;IBM Plex Mono&quot;, Consolas, ui-monospace, monospace">SECTION_DEPART</text></g><g><rect x="640" y="330" width="210" height="38" rx="19" fill="#172331" stroke="#172331" stroke-width="1.3"/><text x="745" y="353.1666666666667" font-size="12.5" font-weight="600" fill="#ffffff" text-anchor="middle" font-family="&quot;IBM Plex Mono&quot;, Consolas, ui-monospace, monospace">CHECKOUT_ARRIVE</text></g><g><rect x="300" y="330" width="170" height="38" rx="19" fill="#172331" stroke="#172331" stroke-width="1.3"/><text x="385" y="353.1666666666667" font-size="12.5" font-weight="600" fill="#ffffff" text-anchor="middle" font-family="&quot;IBM Plex Mono&quot;, Consolas, ui-monospace, monospace">SERVICE_END</text></g><g><path d="M190,129 L300,129" fill="none" stroke="#172331" stroke-width="1.8" marker-end="url(#arrow-strong)" stroke-linejoin="round"/></g><g><rect x="209.54" y="94" width="70.92" height="16" rx="3" fill="#ffffff"/><text x="245" y="105" font-size="11" fill="#556270" text-anchor="middle" font-weight="400">walk to the</text></g><g><rect x="203.82" y="108" width="82.36" height="16" rx="3" fill="#ffffff"/><text x="245" y="119" font-size="11" fill="#556270" text-anchor="middle" font-weight="400">first section</text></g><g><path d="M500,129 L640,129" fill="none" stroke="#172331" stroke-width="1.8" marker-end="url(#arrow-strong)" stroke-linejoin="round"/></g><g><rect x="531.68" y="94" width="76.64" height="16" rx="3" fill="#ffffff"/><text x="570" y="105" font-size="11" fill="#556270" text-anchor="middle" font-weight="400">pick k items</text></g><g><rect x="523.1" y="108" width="93.8" height="16" rx="3" fill="#ffffff"/><text x="570" y="119" font-size="11" fill="#556270" text-anchor="middle" font-weight="400" font-family="&quot;IBM Plex Mono&quot;, Consolas, ui-monospace, monospace">Gamma(k, m_p)</text></g><g><path d="M740,110 L740,60 L400,60 L400,110" fill="none" stroke="#172331" stroke-width="1.8" marker-end="url(#arrow-strong)" stroke-linejoin="round"/></g><g><rect x="408.7" y="38" width="322.6" height="16" rx="3" fill="#ffffff"/><text x="570" y="49" font-size="11" fill="#556270" text-anchor="middle" font-weight="400">walk to the next section   [more sections on the route]</text></g><g><path d="M745,148 L745,330" fill="none" stroke="#172331" stroke-width="1.8" marker-end="url(#arrow-strong)" stroke-linejoin="round"/></g><g><rect x="752" y="222" width="122.4" height="16" rx="3" fill="#ffffff"/><text x="756" y="233" font-size="11" fill="#556270" text-anchor="start" font-weight="400">walk to the checkout</text></g><g><rect x="752" y="238" width="88.08" height="16" rx="3" fill="#ffffff"/><text x="756" y="249" font-size="11" fill="#556270" text-anchor="start" font-weight="400">[last section]</text></g><g><path d="M640,349 L470,349" fill="none" stroke="#172331" stroke-width="1.8" marker-end="url(#arrow-strong)" stroke-linejoin="round"/></g><g><rect x="510.96" y="316" width="88.08" height="16" rx="3" fill="#ffffff"/><text x="555" y="327" font-size="11" fill="#556270" text-anchor="middle" font-weight="400">service time S</text></g><g><rect x="499.52" y="368" width="110.96000000000001" height="16" rx="3" fill="#ffffff"/><text x="555" y="379" font-size="11" fill="#556270" text-anchor="middle" font-weight="400">[counter was free]</text></g><path d="M330,368 C300,440 470,440 440,368" fill="none" stroke="#172331" stroke-width="1.8" marker-end="url(#arrow-strong)"/><g><rect x="286.62" y="436" width="196.76000000000002" height="16" rx="3" fill="#ffffff"/><text x="385" y="447" font-size="11" fill="#556270" text-anchor="middle" font-weight="400">service time of the next customer</text></g><g><rect x="332.38" y="452" width="105.24000000000001" height="16" rx="3" fill="#ffffff"/><text x="385" y="463" font-size="11" fill="#556270" text-anchor="middle" font-weight="400">[queue not empty]</text></g><g><rect x="40" y="160" width="200" height="32" rx="6" fill="#ffffff" stroke="#d5dbe2" stroke-width="1.3"/><text x="52" y="179.25" font-size="11" fill="#556270" text-anchor="start">customers in store + 1</text></g><g><rect x="300" y="160" width="200" height="32" rx="6" fill="#ffffff" stroke="#d5dbe2" stroke-width="1.3"/><text x="312" y="179.25" font-size="11" fill="#556270" text-anchor="start">record the section arrival</text></g><g><rect x="860" y="100" width="210" height="32" rx="6" fill="#ffffff" stroke="#d5dbe2" stroke-width="1.3"/><text x="872" y="119.25" font-size="11" fill="#556270" text-anchor="start">record the section departure</text></g><g><rect x="860" y="300" width="210" height="64" rx="6" fill="#ffffff" stroke="#d5dbe2" stroke-width="1.3"/><text x="872" y="318.75" font-size="11" fill="#556270" text-anchor="start">strategy chooses counter c</text><text x="872" y="335.25" font-size="11" fill="#556270" text-anchor="start">free: start service, B_c = 1</text><text x="872" y="351.75" font-size="11" fill="#556270" text-anchor="start">busy: join queue, Q_c + 1</text></g><g><rect x="30" y="300" width="230" height="80" rx="6" fill="#ffffff" stroke="#d5dbe2" stroke-width="1.3"/><text x="42" y="318.5" font-size="11" fill="#556270" text-anchor="start">record the departure</text><text x="42" y="335" font-size="11" fill="#556270" text-anchor="start">customers in store - 1</text><text x="42" y="351.5" font-size="11" fill="#556270" text-anchor="start">queue not empty: next starts, Q_c - 1</text><text x="42" y="368" font-size="11" fill="#556270" text-anchor="start">queue empty: B_c = 0</text></g><rect x="30" y="500" width="1040" height="70" rx="8" fill="#f6f8fa" stroke="#e2e6eb"/><text x="46" y="524" font-size="12.5" font-weight="600" fill="#172331" text-anchor="start">Reading the graph</text><text x="46" y="544" font-size="11.5" fill="#556270" font-weight="400" text-anchor="start"><tspan x="46" dy="0">A dark arrow means the event schedules the next one after the delay written on it; a condition in brackets must be true. Events at the same instant run in this order:</tspan><tspan x="46" dy="15">SERVICE_END, CHECKOUT_ARRIVE, SECTION_DEPART, SECTION_ARRIVE, ARRIVAL, so a cashier is freed before a new customer chooses a counter.</tspan></text></svg>