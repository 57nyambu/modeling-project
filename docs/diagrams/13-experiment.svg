<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 500" width="1100" height="500" role="img" aria-labelledby="experiment-design-t experiment-design-d" font-family="&quot;IBM Plex Sans&quot;, &quot;Segoe UI&quot;, system-ui, -apple-system, sans-serif"><title id="experiment-design-t">Experiment design</title><desc id="experiment-design-d">Each replication uses a new seed to generate one set of customers that all three strategies serve (common random numbers); results over replications give means, confidence intervals and paired differences.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#5d6b7a"/></marker><marker id="arrow-strong" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#172331"/></marker><marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#257de0"/></marker></defs><rect x="0" y="0" width="1100" height="500" fill="#ffffff"/><g><rect x="30" y="30" width="660" height="330" rx="10" fill="#fafbfc" stroke="#d5dbe2" stroke-width="1.2"/><text x="44" y="52" font-size="12.5" font-weight="600" fill="#556270" text-anchor="start">Repeat for each replication r = 1, 2, ..., R</text></g><g><rect x="56" y="74" width="170" height="60" rx="8" fill="#f5f7f9" stroke="#b5bec8" stroke-width="1.3"/><text x="141" y="100" font-size="13" font-weight="600" fill="#172331" text-anchor="middle">Seed + r - 1</text><text x="141" y="117" font-size="11.5" fill="#556270" text-anchor="middle">a new random stream</text></g><g><path d="M226,104 L262,104" fill="none" stroke="#5d6b7a" stroke-width="1.4" marker-end="url(#arrow)" stroke-linejoin="round"/></g><g><rect x="262" y="64" width="190" height="80" rx="8" fill="#eef4fd" stroke="#9dbbe8" stroke-width="1.3"/><text x="357" y="83" font-size="13" font-weight="600" fill="#172331" text-anchor="middle">Generate customers</text><text x="357" y="100" font-size="11.5" fill="#556270" text-anchor="middle">once per replication:</text><text x="357" y="117" font-size="11.5" fill="#556270" text-anchor="middle">arrivals, baskets, routes,</text><text x="357" y="134" font-size="11.5" fill="#556270" text-anchor="middle">service times</text></g><g><g><path d="M357,144 L357,158 L490,158 L490,192 L500,192" fill="none" stroke="#5d6b7a" stroke-width="1.4" marker-end="url(#arrow)" stroke-linejoin="round"/></g><rect x="500" y="170" width="172" height="44" rx="8" fill="#ffffff" stroke="#d5dbe2"/><rect x="512" y="187" width="10" height="10" rx="2" fill="#257de0"/><text x="530" y="197" font-size="12" font-weight="600" fill="#172331" text-anchor="start">Shortest Queue</text></g><g><g><path d="M357,144 L357,158 L490,158 L490,252 L500,252" fill="none" stroke="#5d6b7a" stroke-width="1.4" marker-end="url(#arrow)" stroke-linejoin="round"/></g><rect x="500" y="230" width="172" height="44" rx="8" fill="#ffffff" stroke="#d5dbe2"/><rect x="512" y="247" width="10" height="10" rx="2" fill="#f47230"/><text x="530" y="257" font-size="12" font-weight="600" fill="#172331" text-anchor="start">Shortest Estimated Wait</text></g><g><g><path d="M357,144 L357,158 L490,158 L490,312 L500,312" fill="none" stroke="#5d6b7a" stroke-width="1.4" marker-end="url(#arrow)" stroke-linejoin="round"/></g><rect x="500" y="290" width="172" height="44" rx="8" fill="#ffffff" stroke="#d5dbe2"/><rect x="512" y="307" width="10" height="10" rx="2" fill="#00b894"/><text x="530" y="317" font-size="12" font-weight="600" fill="#172331" text-anchor="start">Express and Normal</text></g><g><rect x="369.13" y="164.5" width="111.74000000000001" height="15.5" rx="3" fill="#ffffff"/><text x="425" y="175" font-size="10.5" fill="#556270" text-anchor="middle" font-weight="400">identical customers</text></g><g><rect x="56" y="186" width="380" height="150" rx="8" fill="#ffffff" stroke="#d5dbe2" stroke-width="1.3"/><text x="68" y="224" font-size="12.5" font-weight="600" fill="#172331" text-anchor="start">Common random numbers</text><text x="68" y="240.5" font-size="11" fill="#556270" text-anchor="start">All three strategies see the same arrivals,</text><text x="68" y="257" font-size="11" fill="#556270" text-anchor="start">baskets, routes and service times. Any</text><text x="68" y="273.5" font-size="11" fill="#556270" text-anchor="start">difference in a replication is caused by</text><text x="68" y="290" font-size="11" fill="#556270" text-anchor="start">the strategy, so the comparison is fair and</text><text x="68" y="306.5" font-size="11" fill="#556270" text-anchor="start">needs fewer replications.</text></g><g><path d="M690,120 L736,120" fill="none" stroke="#172331" stroke-width="1.8" marker-end="url(#arrow-strong)" stroke-linejoin="round"/></g><g><path d="M690,270 L736,270" fill="none" stroke="#172331" stroke-width="1.8" marker-end="url(#arrow-strong)" stroke-linejoin="round"/></g><g><rect x="736" y="60" width="334" height="120" rx="8" fill="#eef4fd" stroke="#9dbbe8" stroke-width="1.3"/><text x="748" y="99.5" font-size="12.5" font-weight="600" fill="#172331" text-anchor="start">Summarise each measure</text><text x="748" y="116" font-size="11" fill="#556270" text-anchor="start">mean over R replications</text><text x="748" y="132.5" font-size="11" fill="#556270" text-anchor="start">standard deviation s</text><text x="748" y="149" font-size="11" fill="#556270" text-anchor="start">95% CI = mean +/- t(R-1) x s / sqrt(R)</text></g><g><rect x="736" y="200" width="334" height="140" rx="8" fill="#fff7e0" stroke="#e0b43c" stroke-width="1.3"/><text x="748" y="241.25" font-size="12.5" font-weight="600" fill="#172331" text-anchor="start">Paired differences</text><text x="748" y="257.75" font-size="11" fill="#556270" text-anchor="start">d_r = X_r(strategy) - X_r(Shortest Queue)</text><text x="748" y="274.25" font-size="11" fill="#556270" text-anchor="start">mean of d with its own 95% CI</text><text x="748" y="290.75" font-size="11" fill="#556270" text-anchor="start">interval excludes 0: significant difference</text><text x="748" y="307.25" font-size="11" fill="#556270" text-anchor="start">interval includes 0: no evidence of one</text></g><rect x="30" y="390" width="1040" height="80" rx="8" fill="#f6f8fa" stroke="#e2e6eb"/><text x="48" y="416" font-size="12" fill="#556270" font-weight="400" text-anchor="start"><tspan x="48" dy="0">Why replications? One run is one random day. Ten or more replications show how much the results vary from day to day, and the confidence interval says how</tspan><tspan x="48" dy="15">precisely the average is known. The comparison page and its CSV export show every replication.</tspan></text></svg>