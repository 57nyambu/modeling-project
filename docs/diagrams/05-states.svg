<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 500" width="1100" height="500" role="img" aria-labelledby="customer-life-cycle-t customer-life-cycle-d" font-family="&quot;IBM Plex Sans&quot;, &quot;Segoe UI&quot;, system-ui, -apple-system, sans-serif"><title id="customer-life-cycle-t">Customer life cycle</title><desc id="customer-life-cycle-d">State machine of a customer: walking, shopping, walking to the checkout, waiting, being served and departed, with the event that causes each change.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#5d6b7a"/></marker><marker id="arrow-strong" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#172331"/></marker><marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#257de0"/></marker></defs><rect x="0" y="0" width="1100" height="500" fill="#ffffff"/><circle cx="46" cy="150" r="9" fill="#172331"/><g><path d="M55,150 L130,150" fill="none" stroke="#5d6b7a" stroke-width="1.4" marker-end="url(#arrow)" stroke-linejoin="round"/></g><g><rect x="64.9" y="126" width="54.199999999999996" height="16" rx="3" fill="#ffffff"/><text x="92" y="137" font-size="11" fill="#172331" text-anchor="middle" font-weight="500" font-family="&quot;IBM Plex Mono&quot;, Consolas, ui-monospace, monospace">ARRIVAL</text></g><g><rect x="130" y="118" width="170" height="64" rx="8" fill="#f2effd" stroke="#aa9cf0" stroke-width="1.3"/><text x="215" y="146" font-size="13" font-weight="600" fill="#172331" text-anchor="middle">Walking</text><text x="215" y="163" font-size="11.5" fill="#556270" text-anchor="middle">between points</text></g><g><rect x="420" y="118" width="190" height="64" rx="8" fill="#f2effd" stroke="#aa9cf0" stroke-width="1.3"/><text x="515" y="146" font-size="13" font-weight="600" fill="#172331" text-anchor="middle">Shopping</text><text x="515" y="163" font-size="11.5" fill="#556270" text-anchor="middle">in a section</text></g><g><path d="M300,138 L420,138" fill="none" stroke="#5d6b7a" stroke-width="1.4" marker-end="url(#arrow)" stroke-linejoin="round"/></g><g><rect x="309.8" y="116" width="100.39999999999999" height="16" rx="3" fill="#ffffff"/><text x="360" y="127" font-size="11" fill="#172331" text-anchor="middle" font-weight="500" font-family="&quot;IBM Plex Mono&quot;, Consolas, ui-monospace, monospace">SECTION_ARRIVE</text></g><g><path d="M420,166 L300,166" fill="none" stroke="#5d6b7a" stroke-width="1.4" marker-end="url(#arrow)" stroke-linejoin="round"/></g><g><rect x="309.8" y="178" width="100.39999999999999" height="16" rx="3" fill="#ffffff"/><text x="360" y="189" font-size="11" fill="#172331" text-anchor="middle" font-weight="500" font-family="&quot;IBM Plex Mono&quot;, Consolas, ui-monospace, monospace">SECTION_DEPART</text></g><text x="360" y="206" font-size="10.5" font-weight="400" fill="#556270" text-anchor="middle">more sections to visit</text><g><rect x="760" y="118" width="210" height="64" rx="8" fill="#f2effd" stroke="#aa9cf0" stroke-width="1.3"/><text x="865" y="146" font-size="13" font-weight="600" fill="#172331" text-anchor="middle">Walking to checkout</text><text x="865" y="163" font-size="11.5" fill="#556270" text-anchor="middle">after the last section</text></g><g><path d="M610,150 L760,150" fill="none" stroke="#5d6b7a" stroke-width="1.4" marker-end="url(#arrow)" stroke-linejoin="round"/></g><g><rect x="634.8" y="128" width="100.39999999999999" height="16" rx="3" fill="#ffffff"/><text x="685" y="139" font-size="11" fill="#172331" text-anchor="middle" font-weight="500" font-family="&quot;IBM Plex Mono&quot;, Consolas, ui-monospace, monospace">SECTION_DEPART</text></g><text x="685" y="170" font-size="10.5" font-weight="400" fill="#556270" text-anchor="middle">last section done</text><g><rect x="760" y="318" width="210" height="64" rx="8" fill="#f2effd" stroke="#aa9cf0" stroke-width="1.3"/><text x="865" y="346" font-size="13" font-weight="600" fill="#172331" text-anchor="middle">Waiting in queue</text><text x="865" y="363" font-size="11.5" fill="#556270" text-anchor="middle">first in, first out</text></g><g><rect x="420" y="318" width="190" height="64" rx="8" fill="#f2effd" stroke="#aa9cf0" stroke-width="1.3"/><text x="515" y="346" font-size="13" font-weight="600" fill="#172331" text-anchor="middle">Being served</text><text x="515" y="363" font-size="11.5" fill="#556270" text-anchor="middle">scan and pay</text></g><g><rect x="130" y="318" width="170" height="64" rx="8" fill="#f2effd" stroke="#aa9cf0" stroke-width="1.3"/><text x="215" y="346" font-size="13" font-weight="600" fill="#172331" text-anchor="middle">Departed</text><text x="215" y="363" font-size="11.5" fill="#556270" text-anchor="middle">left through the exit</text></g><g><path d="M865,182 L865,318" fill="none" stroke="#5d6b7a" stroke-width="1.4" marker-end="url(#arrow)" stroke-linejoin="round"/></g><g><rect x="871" y="226" width="107" height="16" rx="3" fill="#ffffff"/><text x="875" y="237" font-size="11" fill="#172331" text-anchor="start" font-weight="500" font-family="&quot;IBM Plex Mono&quot;, Consolas, ui-monospace, monospace">CHECKOUT_ARRIVE</text></g><text x="875" y="256" font-size="10.5" font-weight="400" fill="#556270" text-anchor="start">counter busy or queue not empty</text><g><path d="M800,182 L560,318" fill="none" stroke="#5d6b7a" stroke-width="1.4" marker-end="url(#arrow)" stroke-linejoin="round"/></g><g><rect x="586.5" y="226" width="107" height="16" rx="3" fill="#ffffff"/><text x="640" y="237" font-size="11" fill="#172331" text-anchor="middle" font-weight="500" font-family="&quot;IBM Plex Mono&quot;, Consolas, ui-monospace, monospace">CHECKOUT_ARRIVE</text></g><text x="640" y="256" font-size="10.5" font-weight="400" fill="#556270" text-anchor="middle">counter free: start service at once</text><g><path d="M760,350 L610,350" fill="none" stroke="#5d6b7a" stroke-width="1.4" marker-end="url(#arrow)" stroke-linejoin="round"/></g><g><rect x="644.7" y="328" width="80.6" height="16" rx="3" fill="#ffffff"/><text x="685" y="339" font-size="11" fill="#172331" text-anchor="middle" font-weight="500" font-family="&quot;IBM Plex Mono&quot;, Consolas, ui-monospace, monospace">SERVICE_END</text></g><text x="685" y="372" font-size="10.5" font-weight="400" fill="#556270" text-anchor="middle">of the customer ahead</text><g><path d="M420,350 L300,350" fill="none" stroke="#5d6b7a" stroke-width="1.4" marker-end="url(#arrow)" stroke-linejoin="round"/></g><g><rect x="319.7" y="328" width="80.6" height="16" rx="3" fill="#ffffff"/><text x="360" y="339" font-size="11" fill="#172331" text-anchor="middle" font-weight="500" font-family="&quot;IBM Plex Mono&quot;, Consolas, ui-monospace, monospace">SERVICE_END</text></g><g><path d="M130,350 L70,350" fill="none" stroke="#5d6b7a" stroke-width="1.4" marker-end="url(#arrow)" stroke-linejoin="round"/></g><circle cx="58" cy="350" r="11" fill="none" stroke="#172331" stroke-width="1.6"/><circle cx="58" cy="350" r="6" fill="#172331"/><rect x="130" y="418" width="840" height="52" rx="8" fill="#f6f8fa" stroke="#e2e6eb"/><text x="148" y="440" font-size="11.5" fill="#556270" font-weight="400" text-anchor="start"><tspan x="148" dy="0">When the run stops at closing time T, customers who are walking, shopping, waiting or being served are not lost: they are reported as</tspan><tspan x="148" dy="15">remaining in the system, split by state.</tspan></text></svg>